<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / roster</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/details.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>
    <script src="js/roster-demo.js"></script>
    <style>
        .flight-tile { position: relative; height: auto; container-type: inline-size; }
        .flight-over { opacity: .65; }
        /* a value which the server does not give yet */
        .todo { color: #dc3545; font-weight: 700; }
        /* the numbers of the flight (tickets, income) are in the bottom right corner of the tile in any state of the flight, they do not move */
        .flight-tile { min-height: 7.5rem; }
        .flight-sales { position: absolute; bottom: .75rem; right: 1.1rem; width: 10.5rem; font-size: .9rem; line-height: 1.5; }
        /* a ferry flight has one line: it is at the level of the centres of the letters of the airports, at the right edge */
        .flight-sales.is-ferry { top: 2.4rem; bottom: auto; height: 2.4rem; display: flex; align-items: center; }
        .flight-sales.is-ferry > div { justify-content: flex-end; }
        /* the actions of the flight: a small square button with three dots in the top right corner, the actions are in its menu */
        .flight-menu { position: absolute; top: .4rem; right: .5rem; z-index: 2; }
        .flight-menu-btn { width: 1.7rem; height: 1.7rem; padding: 0; line-height: 1; font-size: 1rem; }
        /* the menu goes over the tiles below: the tile with an open menu is over its neighbours (the tile is a container, so it is a stacking context of its own) */
        .flight-tile:has(.dropdown-menu.show) { z-index: 5; }
        /* a narrow tile (a narrow window): the route and the numbers are smaller, so they do not run into each other */
        @container (max-width: 540px) {
            .flight-tile .flight-route { font-size: 1.3rem; }
            .flight-sales { width: 8.6rem; font-size: .8rem; }
        }
        .flight-sales > div { display: flex; justify-content: space-between; gap: 1rem; }
        /* with the line of the state the four lines are pressed a bit, so the block is not higher than the tile */
        .flight-sales.has-state { line-height: 1.3; }
        .flight-sales .sales-label { color: var(--bs-secondary-color); }
        .flight-tile:last-child { margin-bottom: 0 !important; }
        /* the tile of the aircraft: to the left of the flights of the aircraft, half a tile wide and as high as they are, next to them */
        .aircraft-tile { width: 50%; height: 100%; padding: .9rem .75rem; }
        .aircraft-tile .aircraft-value { font-size: 1.35rem; font-weight: 700; line-height: 1.3; }
        @media (max-width: 767.98px) { .aircraft-tile { width: 100%; height: auto; } }
        .flight-route { font-size: 1.9rem; font-weight: 700; line-height: 1.25; }
        .flight-cancel { position: absolute; top: .45rem; right: .6rem; }
        /* the tile of the next flight: half grey, half filled, a link */
        .next-tile { display: block; height: auto; margin-bottom: 0; text-decoration: none; color: var(--bs-secondary-color); background: var(--bs-tertiary-bg); border-style: dashed; opacity: .85; }
        .next-tile:hover { opacity: 1; color: var(--bs-body-color); border-color: var(--bs-primary-border-subtle); }
        .next-tile .flight-route { color: var(--bs-secondary-color); }
        /* the two big buttons of the page of the pilot: as wide as a tile and a quarter as high */
        .fly-button { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 4 / 1; padding: .4rem; font-size: 1.2rem; font-weight: 700;
            line-height: 1.2; text-align: center; white-space: normal; border-radius: .75rem; }
        /* a flight which is in conflict with the previous one: a red edge, the box with the reason and the buttons right under the tile */
        .flight-conflict { border-left: .4rem solid var(--bs-danger) !important; border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0 !important; }
        .flight-affected { border-left: .4rem solid var(--bs-warning) !important; border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0 !important; }
        .conflict-box { padding: .6rem .9rem; margin-bottom: 1rem; border: 1px solid var(--bs-danger-border-subtle); border-top: 0; border-left: .4rem solid var(--bs-danger);
            border-radius: 0 0 .75rem .75rem; background: var(--bs-danger-bg-subtle); color: var(--bs-danger-text-emphasis); }
        .conflict-box.is-caution { border-color: var(--bs-warning-border-subtle); border-left-color: var(--bs-warning); background: var(--bs-warning-bg-subtle); color: var(--bs-warning-text-emphasis); }
        .conflict-box .btn { --bs-btn-padding-y: .1rem; --bs-btn-padding-x: .55rem; --bs-btn-font-size: .85rem; }
        /* a flight which is in the air without any trouble: the pale blue tile of the current stage of the flight dashboard */
        .flight-flying { background: color-mix(in srgb, var(--bs-primary) 7%, var(--bs-body-bg)) !important; border-color: color-mix(in srgb, var(--bs-primary) 35%, var(--bs-body-bg)) !important; }
        /* a diverted flight: a pale orange tile, the box under it is orange too */
        .flight-diverted { border-left: .4rem solid var(--bs-orange) !important; background: rgba(253, 126, 20, .12) !important; border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0 !important; }
        .conflict-box.is-divert { border-color: rgba(253, 126, 20, .4); border-left-color: var(--bs-orange); background: rgba(253, 126, 20, .12); color: var(--bs-body-color); }
        .was-route { font-weight: 600; color: var(--bs-orange-text-emphasis, #984c0c); }
        .time-was { color: var(--bs-secondary-color); text-decoration: line-through; }
        .time-late { color: var(--bs-warning-text-emphasis); font-weight: 600; }
        .time-early { color: var(--bs-success-text-emphasis); font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4">
    <div id="pageHeader"></div>

    <!-- the line of the subtitle: on the right the switch of the flights which are shown -->
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-4">
        <p class="text-secondary mb-0">The flights you have booked, in the order you fly them.</p>
        <div class="d-flex align-items-center gap-2">
            <span class="text-secondary small" id="reloadedAt"></span>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="reloadRoster" title="Load the flights again; it is done by itself once a minute">Reload</button>
            <div class="btn-group btn-group-sm" role="group" aria-label="Which flights are shown" id="flightsFilter">
                <button type="button" class="btn btn-outline-secondary" data-filter="recent"
                        title="The flights which are not over and the ones which ended not earlier than 12 hours ago">Recent flights</button>
                <button type="button" class="btn btn-outline-secondary" data-filter="all" title="All the flights, the old ones too">All flights</button>
            </div>
        </div>
    </div>

    <div id="rosterBody"></div>

    <div class="row g-3 mt-2 justify-content-center">
        <div class="col-6 col-md-3">
            <a class="btn btn-outline-primary fly-button" id="bookShadowJet" href="shadow-jet.html">Book ShadowJet flight</a>
        </div>
        <div class="col-6 col-md-3">
            <a class="btn btn-outline-primary fly-button" id="bookBusyBirds" href="busy-birds.html">Book busyBirds flight</a>
        </div>
    </div>
</main>

<script>

    // 'HH:MM', with the day ('30 Oct') when it is not today (UTC)
    function timeLabel(millis) {
        const d = new Date(millis);
        const hhmm = pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
        const sameDay = Math.floor(millis / 86400000) === Math.floor(Date.now() / 86400000);
        return sameDay ? hhmm : d.toLocaleDateString('en-GB', {day: 'numeric', month: 'short', timeZone: 'UTC'}) + ' ' + hhmm;
    }

    // The id of the first flight of the roster which is not over: only it has the menu (the square button with three dots in the corner of its tile) with the action Fly, it goes
    // to the flight dashboard, where the pilot starts the flight. The other flights have no menu. TODO Reschedule and Cancel are not shown until the server has them (they were disabled buttons, removed 2026-10-30).
    let firstFlightToFlyId = null;

    function actionsHtml(fl) {
        // only the first flight which is not over has a button
        if (fl.id !== firstFlightToFlyId || !isRosterFlightActive(fl)) {
            return '';
        }
        return '<div class="dropdown flight-menu"><button type="button" class="btn btn-outline-secondary flight-menu-btn" data-bs-toggle="dropdown" aria-expanded="false" ' +
            'aria-label="Actions of the flight" title="Actions">&#8942;</button>' +
            '<ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item fw-semibold text-success" href="flight-dashboard.html">Fly</a></li></ul></div>';
    }

    // the flight is in the air or on the way to it and from it: the status is written in blue (Departure, Flying, Arrival and the postflight)
    function isFlying(fl) {
        return fl.status === 'Departure' || fl.status === 'Flying' || fl.status === 'Arrival';
    }

    function isInProgress(fl) {
        return isFlying(fl) || fl.status === 'Postflight';
    }

    // The tickets and the income come from my-flights (sold, and remained = seats - sold; no numbers when the flight has no transport flight; the income is the sum of the
    // price of the journeys of the flight, 0 for the flights which were before the income and for the journeys without a price).
    function salesHtml(fl) {
        // a flight without a transport flight is a ferry flight (no passengers, so no tickets and no income); the one which landed at another airport and whose passengers went on in
        // another flight is not a ferry flight but a diverted one, in dark red as the new airport of the divert in the dashboard
        if (fl.ferry) {
            const label = fl.diverted
                ? '<span class="fw-semibold" style="color: var(--bs-danger-text-emphasis)">Diverted flight</span>'
                : '<span class="text-primary fw-semibold">Ferry flight</span>';
            return '<div class="flight-sales is-ferry"><div>' + label + '</div></div>';
        }
        const num = function (n) { return n === null || n === undefined ? '&mdash;' : String(n); };
        // by the state of the flight: before the departure the tickets which were sold and remained; in the departure, the flying and the arrival the passengers on board; in
        // the postflight (the deboarding makes the number on board go down) and in the end the passengers carried
        const tickets = (fl.status === 'Postflight' || fl.status === 'Finished')
            ? '<div><span class="sales-label">Carried PAX</span><span class="fw-semibold">' + num(fl.carried) + '</span></div>'
            : (isFlying(fl)
                ? '<div><span class="sales-label">On board</span><span class="fw-semibold">' + num(fl.onBoard) + '</span></div>'
                : '<div><span class="sales-label">Sold tickets</span><span class="fw-semibold">' + num(fl.sold) + '</span></div>' +
                  '<div><span class="sales-label">Remained</span><span class="fw-semibold">' + num(fl.remained) + '</span></div>');
        // the state of the transport flight over the numbers: now only the open check-in (a green bold line), the other states come later (todo ak1 below)
        const checkInOpen = fl.tfStatus === 'CheckIn';
        return '<div class="flight-sales' + (checkInOpen ? ' has-state' : '') + '">' +
            (checkInOpen ? '<div><span class="text-success fw-bold">Check-in open</span></div>' : '') + tickets +
            '<div><span class="sales-label">Income</span><span class="fw-semibold">' + (fl.income === null || fl.income === undefined ? '&mdash;' : moneyHtml(fl.income)) + '</span></div></div>';
    }

    // todo ak1 (near future, 2026-10-30) the state of the check-in in the tile of a flight: "the check-in starts at 14:30", "the check-in goes" (how many have checked in, my-flights has
    // checkedIn), "the check-in is closed". The check-in of the next flight often starts before the previous flight lands, so it is good to see it. my-flights has no time of
    // the start of the check-in yet (TransportFlightHelper.calcCheckinStartTime), it must be given as a new field. The boarding and the deboarding later, the same way.
    // A booked flight, a double tile in the middle. The operator, the type and the aircraft are in the tile of the aircraft next to it. Only the last flight of
    // the roster can be cancelled.
    // The forecast of the flight (fl.forecast, from the server; null when there is nothing to tell): the expected times, the divert, the conflict with the flight before it.
    // The planned time is crossed out and the expected one is next to it when the flight is expected to leave or to land 5 minutes or more off the plan: in orange when it is
    // later than planned, in green when it is earlier. A diverted flight goes to the airport of the divert now: its arrival is the arrival there.
    function expectedTimeHtml(planned, expected, prefix) {
        return '<span class="time-was">' + timeLabel(planned) + '</span> <span class="' + (expected > planned ? 'time-late' : 'time-early') + '">' + (prefix || '') + timeLabel(expected) + '</span>';
    }

    function timesHtml(fl) {
        const f = fl.forecast;
        const dep = f && f.expDep ? expectedTimeHtml(fl.dep, f.expDep) : timeLabel(fl.dep);
        if (f && f.divertTo) {
            // the plan is for the destination, the aircraft goes to the divert airport: the planned arrival is not the one to compare with
            return dep + ' &rarr; ' + (f.expArr ? '<span class="time-late">' + timeLabel(f.expArr) + '</span>' : '?');
        }
        const arr = f && f.expArr ? expectedTimeHtml(fl.arr, f.expArr) : timeLabel(fl.arr);
        return dep + ' &rarr; ' + arr;
    }

    // the flight is expected to be later than planned (Delayed) or earlier (Ahead of schedule) in the departure or in the arrival; the flight which is in conflict or diverted is
    // told by its box and its badge, not by this
    function scheduleStateHtml(fl) {
        const f = fl.forecast;
        if (!f || f.conflict || f.divertTo || !(f.expDep || f.expArr)) {
            return '';
        }
        const later = (f.expDep && f.expDep > fl.dep) || (f.expArr && f.expArr > fl.arr);
        return later ? ' <span class="time-late">&#9201; Delayed</span>' : ' <span class="time-early">Ahead of schedule</span>';
    }

    // The buttons of the conflicts which are shown before their actions are made: 'Choose another time', 'Move this flight too', 'Resolve conflicts'
    function notImplementedButton(cls, text) {
        return '<button type="button" class="btn ' + cls + ' not-implemented">' + text + '</button>';
    }

    // The box under a flight which is in conflict with the flight before it: red when the flight before it is as it is (late, diverted), yellow when the conflict appears only after
    // the flights before it are moved. The text is made of the numbers of the server.
    // The box under a diverted flight: what it was, where it is now and where the airline expects it to deliver the passengers
    function diversionBoxHtml(fl) {
        const f = fl.forecast;
        if (!f || !f.divertTo) {
            return '';
        }
        const original = '<b>' + fl.from + ' &rarr; ' + fl.to + '</b>';
        return '<div class="conflict-box is-divert"><div><b>&#9888; Diversion</b></div><div class="small my-1">This was the flight ' + original + ', diverted to <b>' + esc(f.divertTo) + '</b>. ' +
            (f.expArr ? 'The aircraft is at the gate in ' + esc(f.divertTo) + ' at ' + timeLabel(f.expArr) + ', but the airline expects you to deliver the passengers to ' + fl.to +
                ' after the problem is solved. ' : 'The airline expects you to deliver the passengers to ' + fl.to + ' after the problem is solved. ') +
            (f.destNotBefore ? 'By our estimate you will be at ' + fl.to + ' not before <b>' + timeLabel(f.destNotBefore) + '</b> (the flight to ' + esc(f.divertTo) +
                ', an hour on the ground there, the planned flight to ' + fl.to + ').' : '') + '</div></div>';
    }

    function conflictBoxHtml(fl) {
        const c = fl.forecast ? fl.forecast.conflict : null;
        if (!c) {
            return '';
        }
        const route = '<b>' + esc(c.causeRoute) + '</b>';
        if (c.level === 'yellow') {
            return '<div class="conflict-box is-caution"><div><b>&#9888; Affected</b>' + (c.estimate ? ' <span class="small">(estimate)</span>' : '') + '</div>' +
                '<div class="small my-1">If the flight before it (' + route + ') is moved to the earliest time it can leave, this flight will be ' + c.shortfallMinutes +
                ' min short of the gap between the flights too: the earliest departure is then ' + timeLabel(c.suggestedDep) + '.</div>' +
                '<div class="d-flex flex-wrap gap-2">' + notImplementedButton('btn-outline-warning', 'Move this flight too') + '</div></div>';
        }
        const why = c.estimate
            ? 'The flight before it (' + route + ') is diverted: the earliest the aircraft can be at its destination is an estimate, and an hour on the ground is needed after that.'
            : 'The flight before it (' + route + ') is late.';
        // the flight is moved in steps of 5 minutes, to the earliest time which is not earlier than the suggested one
        const shiftMinutes = Math.ceil((c.suggestedDep - fl.dep) / 300000) * 5;
        const newDep = fl.dep + shiftMinutes * 60000;
        const move = shiftMinutes > 0
            ? '<button type="button" class="btn btn-danger move-flight" data-flight-id="' + esc(fl.id) + '" data-shift="' + shiftMinutes + '" data-confirm="' +
                esc('Move the flight ' + fl.from + ' - ' + fl.to + ' from ' + timeLabel(fl.dep) + ' to ' + timeLabel(newDep) + '? The passengers stay with the flight.') + '">Move to ' + timeLabel(newDep) + '</button>'
            : '';
        return '<div class="conflict-box"><div><b>&#9940; Conflict</b>' + (c.estimate ? ' <span class="small">(estimate)</span>' : '') + '</div>' +
            '<div class="small my-1">' + why + ' This flight leaves ' + timeLabel(fl.dep) + ': it is ' + c.shortfallMinutes + ' min short of the gap between the flights. ' +
            'The earliest departure is ' + timeLabel(c.suggestedDep) + '.</div><div class="d-flex flex-wrap gap-2">' +
            move + notImplementedButton('btn-outline-danger', 'Choose another time') + '</div></div>';
    }

    // the flight is in the air and there is nothing wrong with it: not diverted, not late, no conflict (earlier than planned is fine)
    function isFlyingWithoutTrouble(fl) {
        const f = fl.forecast;
        if (!isFlying(fl)) {
            return false;
        }
        if (!f) {
            return true;
        }
        const later = (f.expDep && f.expDep > fl.dep) || (f.expArr && f.expArr > fl.arr);
        return !f.divertTo && !f.conflict && !later;
    }

    function flightTile(fl, isLast) {
        const f = fl.forecast;
        const conflict = f ? f.conflict : null;
        const diverted = !!(f && f.divertTo);
        const box = diversionBoxHtml(fl) + conflictBoxHtml(fl);
        const tile = '<div class="stat flight-tile mb-3' + (isRosterFlightActive(fl) ? '' : ' flight-over') + (diverted ? ' flight-diverted' : (conflict ? (conflict.level === 'red' ? ' flight-conflict' : ' flight-affected') : (isFlyingWithoutTrouble(fl) ? ' flight-flying' : ''))) + '">' +
            // TODO the cross which cancels the last flight is taken off for now: (isLast ? '<button ... data-cancel="' + fl.id + '">&#10005;</button>' : '')
            salesHtml(fl) + actionsHtml(fl) +
            '<div class="stat-label' + (isInProgress(fl) ? ' text-primary' : '') + '">' + fl.status +
            scheduleStateHtml(fl) +
            (diverted ? ' <span class="badge text-bg-warning">&#9888; Diverted</span>' : '') + '</div>' +
            // a diverted flight goes to the airport of the divert, so the route says that, and the flight of the plan is told under it
            '<div class="flight-route">' + fl.from + ' &rarr; ' + (diverted ? esc(f.divertTo) : fl.to) + '</div>' +
            (diverted ? '<div class="small was-route">Was ' + fl.from + ' &rarr; ' + fl.to + ', diverted to ' + esc(f.divertTo) + '</div>' : '') +
            '<div class="stat-hint">' + timesHtml(fl) + '</div>' +
            '</div>';
        return tile + box;
    }

    const SECTION_GAP_MILLIS = 24 * 60 * 60 * 1000;

    // The sections: the neighbour flights go together while the aircraft is the same and the gap between the arrival of a flight and the departure of the next one is not
    // longer than 24 hours. Another aircraft or a longer gap starts a new section (its own tile of the aircraft and a line before it).
    function groupFlights(flights) {
        const groups = [];
        flights.forEach(function (fl) {
            const group = groups[groups.length - 1];
            const prev = group ? group.flights[group.flights.length - 1] : null;
            if (group && group.reg === fl.reg && fl.dep - prev.arr <= SECTION_GAP_MILLIS) {
                group.flights.push(fl);
            } else {
                groups.push({reg: fl.reg, type: fl.type, operatorName: fl.operatorName, flights: [fl]});
            }
        });
        return groups;
    }

    // The tile of the aircraft (the vertical one, the operator, the type, the registration) on the left, the flights of the aircraft in the middle: as high as the flights
    function groupHtml(group, lastFlightId, afterFlights) {
        return '<div class="row g-3 mb-3 justify-content-center"><div class="col-12 col-md-3 d-flex justify-content-md-end">' +
            '<div class="stat aircraft-tile' + (group.flights.every(function (fl) { return !isRosterFlightActive(fl); }) ? ' flight-over' : '') + '">' + (group.operatorName
                ? '<div class="stat-label">' + esc(group.operatorName) + '</div>'
                : '<div class="stat-label todo" title="the aircraft has no operator">TODO operator</div>') +
            '<div class="aircraft-value">' + group.type + '</div><div class="aircraft-value">' + group.reg + '</div></div></div>' +
            '<div class="col-12 col-md-6">' + group.flights.map(function (fl) { return flightTile(fl, fl.id === lastFlightId); }).join('') + (afterFlights || '') + '</div>' +
            '<div class="col-md-3 d-none d-md-block"></div></div>';
    }

    // The tile of the next flight with the values which are known already: the airport of the departure, the aircraft, the earliest time.
    // The page of ShadowJet opens with these fixed, only the time (and the airport of the arrival) is chosen there.
    function nextFlightTile(last) {
        const c = rosterContinuation([last], true);
        return '<a class="stat next-tile" href="' + shadowJetHref(c) + '">' +
            '<div class="stat-label">Book the next flight</div>' +
            '<div class="flight-route">' + c.from + ' &rarr; ?</div>' +
            '<div class="stat-hint">Not earlier than ' + timeLabel(c.notBefore) + '</div>' +
            '</a>';
    }

    // Which flights are shown: the recent ones (the flights which are not over and the ones which ended not earlier than 12 hours ago) or all of them.
    // The choice is remembered in the browser.
    const RECENT_MILLIS = 12 * 60 * 60 * 1000;

    function savedFilter() {
        try {
            return localStorage.getItem('airwaysRosterFilter') === 'all' ? 'all' : 'recent';
        } catch (e) {
            return 'recent';
        }
    }

    let rosterFilter = savedFilter();
    let rosterFlights = [];

    function isRecent(fl) {
        return isRosterFlightActive(fl) || fl.arr >= Date.now() - RECENT_MILLIS;
    }

    function renderFilter() {
        $('#flightsFilter .btn').each(function () {
            $(this).toggleClass('active', $(this).attr('data-filter') === rosterFilter);
        });
    }

    function renderRoster(allFlights) {
        rosterFlights = allFlights;
        renderFilter();
        const flights = rosterFilter === 'recent' ? allFlights.filter(isRecent) : allFlights;
        const firstToFly = allFlights.find(isRosterFlightActive);
        firstFlightToFlyId = firstToFly ? firstToFly.id : null;
        const $body = $('#rosterBody');
        // the booking goes on after the last flight of all the flights, also when the old ones are not shown: a new flight (not the continuation) is bound by the booked
        // flights: any place and aircraft, not earlier than 2 hours after the last arrival
        $('#bookShadowJet').attr('href', shadowJetHref(rosterContinuation(allFlights, false)));
        if (flights.length === 0) {
            $body.html('<div class="stat stat-placeholder text-center text-secondary py-3 mb-4">'
                + (allFlights.length === 0 ? 'No flights are booked.' : 'No recent flights. The older ones are under All flights.') + '</div>');
            return;
        }
        let html = '';
        // the red line over the roster when some flights are in conflict
        const conflicts = flights.filter(function (fl) { return fl.forecast && fl.forecast.conflict && fl.forecast.conflict.level === 'red'; }).length;
        const touched = flights.filter(function (fl) { return fl.forecast && fl.forecast.conflict && fl.forecast.conflict.level === 'yellow'; }).length;
        if (conflicts > 0) {
            html += '<div class="alert alert-danger d-flex flex-wrap justify-content-between align-items-center gap-2 py-2"><div><b>' + conflicts +
                (conflicts === 1 ? ' conflict' : ' conflicts') + ' in your roster.</b> The flights which cannot start by their plan are marked in red' +
                (touched > 0 ? ', the ones which the moves would touch in yellow' : '') + '.</div>' +
                notImplementedButton('btn-sm btn-danger', 'Resolve conflicts') + '</div>';
        }
        // the tile of the next flight (only after a flight which is not over) is a part of the last section: the tile of the aircraft is as high as the flights and this tile together
        const groups = groupFlights(flights);
        groups.forEach(function (group, i) {
            const isLastGroup = i === groups.length - 1;
            html += (i > 0 ? '<hr class="my-4">' : '') + groupHtml(group, null, isLastGroup && isRosterFlightActive(flights[flights.length - 1]) ? nextFlightTile(flights[flights.length - 1]) : '');
        });
        html += '<hr class="my-4">';
        $body.html(html);
    }

    // undefined - not loaded yet, null - failed or there is no pilot
    let pilotInfo;

    function renderHeader() {
        $('#pageHeader').html(pilotHeader({kind: 'Pilot', title: 'Roster', avatarImage: pilotInfo ? pilotInfo.avatarImage : null}));
    }

    function loadPilot() {
        airwaysAuth('GET', '/pilot', {}, function (p) {
            pilotInfo = p;
            renderHeader();
        }, function () { /* the header stays without the avatar */ });
    }

    // The list is loaded again by the button and once a minute (not while the page is hidden). A failed reload keeps the list which is shown.
    const RELOAD_PERIOD_MILLIS = 60 * 1000;
    let reloading = false;

    // ?stub=early (the flight is ahead of the plan), ?stub=late (the first flight is an hour late: the second flight is red, the third one yellow), ?stub=divert (the first flight is diverted), ?stub=ok (no conflicts),
    // the data are shaped like the answer of the server: the page shows them without the server
    const STUB = new URLSearchParams(location.search).get('stub');

    function stubRosterFlights(name) {
        const MIN = 60000;
        const base = Math.ceil(Date.now() / (30 * MIN)) * (30 * MIN);
        const flight = function (id, from, to, depMin, durMin, status, extra) {
            return Object.assign({id: id, from: from, to: to, dep: base + depMin * MIN, arr: base + (depMin + durMin) * MIN, reg: 'N-SJ01', type: 'C25C', status: status,
                operatorName: 'ShadowJet', sold: 3, remained: 1, carried: null, onBoard: null, income: 4200, ferry: false, diverted: false, tfStatus: null, forecast: null}, extra);
        };
        if (name === 'late') {
            // the first flight leaves an hour later and lands at +3:30: the second flight (planned +3:10) must leave at +4:00, and then the third one (planned +4:30) is short too
            const f1 = flight('1', 'MMMX', 'MMUN', 30, 120, 'Preflight', {tfStatus: 'WaitingForBoarding', forecast: {expDep: base + 90 * MIN, expArr: base + 210 * MIN, destNotBefore: null, divertTo: null, conflict: null}});
            const f2 = flight('2', 'MMUN', 'MMMX', 190, 120, 'Dispatched', {forecast: {expDep: base + 240 * MIN, expArr: base + 360 * MIN, destNotBefore: null, divertTo: null,
                conflict: {level: 'red', shortfallMinutes: 50, causeRoute: 'MMMX - MMUN', estimate: false, suggestedDep: base + 240 * MIN}}});
            const f3 = flight('3', 'MMUN', 'MMMX', 270, 120, 'Dispatched', {forecast: {expDep: base + 390 * MIN, expArr: base + 510 * MIN, destNotBefore: null, divertTo: null,
                conflict: {level: 'yellow', shortfallMinutes: 120, causeRoute: 'MMUN - MMMX', estimate: false, suggestedDep: base + 390 * MIN}}});
            return [f1, f2, f3];
        }
        if (name === 'divert') {
            const f1 = flight('1', 'MMMX', 'MMUN', -60, 120, 'Flying', {tfStatus: 'Flying', onBoard: 3, remained: null,
                forecast: {expDep: null, expArr: base + 40 * MIN, destNotBefore: base + 200 * MIN, divertTo: 'MMTO', conflict: null}});
            const f2 = flight('2', 'MMUN', 'MMMX', 90, 120, 'Dispatched', {forecast: {expDep: base + 260 * MIN, expArr: base + 380 * MIN, destNotBefore: null, divertTo: null,
                conflict: {level: 'red', shortfallMinutes: 170, causeRoute: 'MMMX - MMUN', estimate: true, suggestedDep: base + 260 * MIN}}});
            const f3 = flight('3', 'MMMX', 'MMUN', 270, 120, 'Dispatched', {forecast: {expDep: base + 410 * MIN, expArr: base + 530 * MIN, destNotBefore: null, divertTo: null,
                conflict: {level: 'yellow', shortfallMinutes: 140, causeRoute: 'MMUN - MMMX', estimate: true, suggestedDep: base + 410 * MIN}}});
            return [f1, f2, f3];
        }
        if (name === 'flying') {
            // the flight is in the air, nothing is wrong with it: the pale blue tile
            return [flight('1', 'MMUN', 'MMMX', -30, 125, 'Flying', {tfStatus: 'Flying', onBoard: 54, remained: null}), flight('2', 'MMMX', 'MMUN', 180, 120, 'Dispatched', {})];
        }
        if (name === 'early') {
            // the flight left 18 minutes before the plan and lands 21 minutes before it
            return [flight('1', 'MMUN', 'MMMX', -30, 125, 'Flying', {tfStatus: 'Flying', onBoard: 54, remained: null,
                forecast: {expDep: base - 48 * MIN, expArr: base + 74 * MIN, destNotBefore: null, divertTo: null, conflict: null}}), flight('2', 'MMMX', 'MMUN', 180, 120, 'Dispatched', {})];
        }
        return [flight('1', 'MMMX', 'MMUN', 30, 120, 'Preflight', {tfStatus: 'CheckIn'}), flight('2', 'MMUN', 'MMMX', 210, 120, 'Dispatched', {})];
    }

    function reloadRoster() {
        if (reloading) {
            return;
        }
        reloading = true;
        $('#reloadRoster').prop('disabled', true);
        (STUB ? function (callback) { callback(stubRosterFlights(STUB)); } : loadRosterFlights)(function (flights) {
            reloading = false;
            $('#reloadRoster').prop('disabled', false);
            renderRoster(flights);
            $('#reloadedAt').text('Updated ' + pad2(new Date().getUTCHours()) + ':' + pad2(new Date().getUTCMinutes()) + ' UTC');
        }, function () {
            reloading = false;
            $('#reloadRoster').prop('disabled', false);
            $('#reloadedAt').text('Reload failed');
        });
    }

    $(document).ready(function () {
        initSiteMenu('pilot-roster');
        renderHeader();
        if (!STUB) {
            loadPilot();
        }
        reloadRoster();
        $('#reloadRoster').on('click', reloadRoster);
        // the buttons of the conflicts are shown before the actions are made
        $(document).on('click', '.not-implemented', function () {
            alert('Hello World: not implemented');
        });
        // 'Move to': the flight is moved to the time of the button (the shift is from the planned departure, the server checks everything and tells why it can not be done)
        $(document).on('click', '.move-flight', function () {
            const $button = $(this);
            if (STUB) {
                alert('The stub data: nothing is sent');
                return;
            }
            if (!confirm($button.attr('data-confirm'))) {
                return;
            }
            $button.prop('disabled', true);
            airwaysAuth('POST', '/flight-dashboard/reschedule', {flightId: $button.attr('data-flight-id'), shiftMinutes: $button.attr('data-shift')}, function () {
                reloadRoster();
            }, function (e) {
                const reason = e && e.responseJSON && e.responseJSON.message ? ': ' + e.responseJSON.message : '';
                alert('The flight was not moved (' + (e && e.status ? 'HTTP ' + e.status : 'no connection') + reason + ')');
                reloadRoster();
            });
        });
        setInterval(function () {
            if (!document.hidden) {
                reloadRoster();
            }
        }, RELOAD_PERIOD_MILLIS);
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                reloadRoster();
            }
        });
        $('#flightsFilter').on('click', '.btn', function () {
            rosterFilter = $(this).attr('data-filter');
            try {
                localStorage.setItem('airwaysRosterFilter', rosterFilter);
            } catch (e) {
                // the choice is just not remembered
            }
            renderRoster(rosterFlights);
        });
    });
</script>
</body>
</html>
