<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / City</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    function renderCity(city) {
        document.title = `airways / ${city.name}`;

        const sum = key => city.airports.reduce((s, a) => s + (a[key] ?? 0), 0);

        const airportRows = city.airports.map(a => [
            airportRef(a),
            fmtNumber(a.flightsOutbound),
            fmtNumber(a.flightsInbound),
            fmtNumber(a.aircraftActive),
            fmtNumber(a.aircraftParked)
        ]);

        $('#page').html(`
            ${entityHeader({
                kind: 'City',
                title: esc(city.name),
                subtitle: esc(city.country ?? ''),
                flagCountry: city.country
            })}

            ${statTiles([
                {label: 'Population', value: fmtCompact(city.population)},
                {label: 'Airports', value: city.airports.length},
                {label: 'Flights out', value: fmtNumber(sum('flightsOutbound'))},
                {label: 'Flights in', value: fmtNumber(sum('flightsInbound'))}
            ])}

            ${section('Airports', dataTable([
                {title: 'Airport'},
                {title: 'Out', cls: 'text-end'},
                {title: 'In', cls: 'text-end'},
                {title: 'A/C active', cls: 'text-end'},
                {title: 'A/C parked', cls: 'text-end'}
            ], airportRows, 'No airports'), {count: city.airports.length, stub: isStub(city, 'airports')})}

            ${stubNote(city)}
        `);
    }

    $(document).ready(function () {
        const id = queryParam('id');
        if (!id) {
            showError('City id is not specified');
            return;
        }
        showLoading();
        loadCityDetails(id)
            .then(city => city ? renderCity(city) : showError(`City '${id}' not found`))
            .catch(e => showError(e.message));
    });
</script>

</body>
</html>
