<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Airport</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    let airport;
    let flightsFilter = 'all';

    // the moment when the flight happens at this airport: departure for outbound, arrival for inbound.
    // actual time if it has already happened, otherwise estimated (inbound) or planned one
    function eventTime(f) {
        return f.direction === 'out' ? (f.atd ?? f.std) : (f.ata ?? f.eta ?? f.sta);
    }

    function plannedTime(f) {
        return f.direction === 'out' ? f.std : f.sta;
    }

    // one chronological list, the latest event first
    function sortFlights(flights) {
        return flights.slice().sort((a, b) =>
            new Date(eventTime(b)) - new Date(eventTime(a)) || (a.aircraft.reg ?? '').localeCompare(b.aircraft.reg ?? ''));
    }

    // actual time is bold, estimated is italic grey, planned is plain; the planned time goes below when it differs
    function eventTimeCell(f) {
        const time = eventTime(f);
        const planned = plannedTime(f);
        const isActual = f.direction === 'out' ? !!f.atd : !!f.ata;
        const isEstimated = !isActual && f.direction === 'in' && !!f.eta;

        const day = fmtDay(time) !== fmtDay(new Date().toISOString())
            ? `<span class="text-secondary small me-1">${fmtDay(time)}</span>` : '';
        const main = isActual
            ? `<span class="time-actual" title="Actual">${fmtTime(time)}</span>`
            : isEstimated
                ? `<span class="time-estimated" title="Estimated">${fmtTime(time)}</span>`
                : `<span title="Planned">${fmtTime(time)}</span>`;
        const below = (isActual || isEstimated) && fmtTime(planned) !== fmtTime(time)
            ? `<div class="time-planned-below" title="Planned">${fmtTime(planned)}</div>` : '';
        return `<span class="text-nowrap">${day}${main}</span>${below}`;
    }

    function flightsTable() {
        const flights = sortFlights(airport.flights.filter(f => flightsFilter === 'all' || f.direction === flightsFilter));
        const rows = flights.map(f => [
            f.direction === 'out'
                ? '<span class="dir text-primary" title="Outbound">DEP</span>'
                : '<span class="dir text-success" title="Inbound">ARR</span>',
            `${aircraftRef(f.aircraft)} <span class="text-secondary small">${esc(f.aircraft.type ?? '')}</span>`,
            airportRef(f.airport),
            eventTimeCell(f),
            statusBadge(f.status)
        ]);

        // "now" line between the future (above) and the past (below)
        const now = Date.now();
        const firstPast = flights.findIndex(f => new Date(eventTime(f)).getTime() <= now);
        const nowRow = {separator: `now &middot; ${fmtTime(new Date().toISOString())} utc`};
        rows.splice(firstPast === -1 ? rows.length : firstPast, 0, nowRow);

        return dataTable([
            {title: ''},
            {title: 'Aircraft'},
            {title: 'From / To'},
            {title: 'Time <span class="text-lowercase fw-normal">utc</span>', cls: 'text-end'},
            {title: 'Status', cls: 'text-end'}
        ], flights.length ? rows : [], 'No flights');
    }

    function flightsFilterButtons() {
        const button = (filter, title) =>
            `<button type="button" class="btn btn-outline-secondary ${flightsFilter === filter ? 'active' : ''}" data-filter="${filter}">${title}</button>`;
        return `<div class="btn-group btn-group-sm" id="flights-filter">
            ${button('all', 'All')}${button('out', 'Outbound')}${button('in', 'Inbound')}
        </div>`;
    }

    function renderFlights() {
        $('#flights').replaceWith(section('Flights', flightsTable(), {
            id: 'flights',
            count: airport.flights.filter(f => flightsFilter === 'all' || f.direction === flightsFilter).length,
            stub: isStub(airport, 'flights'),
            tools: flightsFilterButtons()
        }));
    }

    function renderAirport() {
        document.title = `airways / ${airport.icao}`;

        const cities = airport.cities.map(c => c.id ? cityRef(c, false) : esc(c.name)).join(', ');

        const connectionRows = airport.topConnections.map(c => [airportRef(c), fmtNumber(c.flights)]);

        // 'BusinessAviationTerminal' -> 'Business aviation terminal'
        const facilityTitle = type => (type ?? '').replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase()
            .replace(/^./, c => c.toUpperCase());
        // 'Base airport for BusyBirds', or just 'Base airport' when the operator is unknown
        const facilityLines = airport.facilities.map(f => {
            const title = facilityTitle(f.type);
            return `<div>${esc(title)}${f.operator ? ` for <b>${esc(f.operator)}</b>` : ''}</div>`;
        });

        const parkedRows = airport.parkedAircraft.map(ac => [
            aircraftRef(ac),
            esc(ac.type ?? ''),
            `<span class="text-secondary" title="Parked since">${fmtDay(ac.since)} ${fmtTime(ac.since)}</span>`
        ]);

        $('#page').html(`
            ${entityHeader({
                kind: 'Airport',
                title: `${esc(airport.icao)} <span class="fw-normal text-secondary">${esc(airport.name)}</span>`,
                subtitle: [cities, esc(airport.country ?? '')].filter(Boolean).join(' &middot; '),
                flagCountry: airport.country
            })}

            ${statTiles([
                {label: 'Flights out', value: fmtNumber(airport.stats.flightsOutbound)},
                {label: 'Flights in', value: fmtNumber(airport.stats.flightsInbound)},
                {label: 'Aircraft on ground', value: fmtNumber(airport.stats.aircraftParked)},
                {label: 'Facilities', html: facilityLines.length ? facilityLines.join('') : '<span class="text-secondary">None</span>'}
            ])}

            <div class="row g-4">
                <div class="col-lg-8">
                    <div id="flights"></div>
                </div>
                <div class="col-lg-4">
                    ${section('Top connections', dataTable([
                        {title: 'Airport'},
                        {title: 'Weekly', cls: 'text-end'}
                    ], connectionRows, 'No connections'), {stub: isStub(airport, 'topConnections')})}

                    ${section('Parked aircraft', dataTable([
                        {title: 'Aircraft'},
                        {title: 'Type'},
                        {title: 'Since', cls: 'text-end'}
                    ], parkedRows, 'No aircraft parked'), {count: airport.parkedAircraft.length, stub: isStub(airport, 'parkedAircraft')})}
                </div>
            </div>

            ${stubNote(airport)}
        `);

        renderFlights();
    }

    $(document).ready(function () {
        $('#page').on('click', '#flights-filter button', function () {
            flightsFilter = $(this).data('filter');
            renderFlights();
        });

        const icao = (queryParam('icao') ?? '').trim().toUpperCase();
        if (!icao) {
            showError('Airport ICAO is not specified');
            return;
        }

        // the first load shows the loading/error states, the following ones silently replace the data
        const load = initial => loadAirportDetails(icao)
            .then(response => {
                if (!response) {
                    if (initial) {
                        showError(`Airport '${icao}' not found`);
                    }
                    return;
                }
                airport = response;
                preserveScroll(renderAirport);
            })
            .catch(e => {
                if (initial) {
                    showError(e.message);
                } else {
                    console.warn('refresh failed', e);
                }
            });

        showLoading();
        load(true).then(() => startAutoRefresh(() => load(false)));
    });
</script>

</body>
</html>
