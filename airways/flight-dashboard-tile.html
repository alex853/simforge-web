<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Flight dashboard (tiles)</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>
    <script src="js/pilot-tiles.js"></script>

    <style>
        /* The flight dashboard in tiles (a draft next to flight-dashboard.html, which stays as it is). The rows of tiles change with the stage of the flight, the big
           area under them has the messages, the conditions and the buttons. ?stub=<stage> shows stub data of a stage without the server. */
        .tile-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .tile-grid .tile-2 { grid-column: span 2; }
        @media (max-width: 767px) { .tile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .tile-grid .stat { height: 100%; }
        /* a tile which says that something is wrong: a pale red background */
        .tile-grid .stat.stat-alert { background: color-mix(in srgb, var(--bs-danger) 6%, var(--bs-body-bg)); border-color: color-mix(in srgb, var(--bs-danger) 28%, var(--bs-body-bg)); }
        /* the values of this page are words and may be longer than the numbers of the pilot page: they are not cut */
        .tile-grid .stat-value, .tile-grid .stat-hint { white-space: normal; overflow: visible; text-overflow: clip; }
        .stat-value.big { font-size: 1.55rem; letter-spacing: .02em; }
        .stat-value.good { color: var(--bs-success); }
        .stat-value.bad { color: var(--bs-danger); }
        .stat-value.ferry { color: #1d3f8f; }
        [data-bs-theme="dark"] .stat-value.ferry { color: #6f94ee; }

        /* a time which is only planned or estimated is grey and italic, a time which has happened is plain and bold */
        .t-plan { color: var(--bs-secondary-color); font-style: italic; }
        .t-fact { font-weight: 700; }
        .time-lines { font-size: 1.15rem; line-height: 1.55; }
        .time-lines .k, .count-lines .k { display: inline-block; min-width: 6.4rem; color: var(--bs-secondary-color); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
        .count-lines { font-size: 1.2rem; line-height: 1.5; }
        .count-lines .k { min-width: 7.4rem; }

        /* a place where the server has not got the data yet */
        .todo { color: #e00000; font-weight: 700; font-style: normal; }

        .action-area { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .6rem; padding: 1.4rem 1.6rem; min-height: 9rem; }
        .action-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .6rem; }
        .action-text { font-size: 1.05rem; margin-bottom: .8rem; }
        .checks { list-style: none; padding: 0; margin: 0 0 1rem 0; }
        .checks li { padding: .12rem 0; }
        .checks .ok::before { content: "\2713\00a0"; color: var(--bs-success); font-weight: 700; }
        .checks .no::before { content: "\2717\00a0"; color: var(--bs-danger); font-weight: 700; }
        .action-buttons .btn { margin: 0 .5rem .5rem 0; }
        .todo-list { margin-top: 1.5rem; font-size: .85rem; }
    </style>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4">
    <div id="pageHeader"></div>
    <div id="banners"></div>
    <div id="tiles"></div>
    <div id="area"></div>
    <div class="todo-list" id="todoList"></div>
</main>

<!-- A manual flight pays less than the contract says: before the manual start the pilot sees both numbers and decides -->
<div class="modal fade" id="manualPayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Start the flight in the manual mode?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <div class="modal-body">
                <p>The contract promises you more than a manual flight pays. If you start this flight manually, nothing tracks it and the pay is reduced:</p>
                <table class="table table-sm mb-0">
                    <thead><tr><th></th><th class="text-end">Promised by the contract</th><th class="text-end">If started manually</th></tr></thead>
                    <tbody>
                    <tr><td>Pilot pay</td><td class="text-end" id="mp-flight-contract"></td><td class="text-end text-danger" id="mp-flight-manual"></td></tr>
                    <tr><td>Income share</td><td class="text-end" id="mp-share-contract"></td><td class="text-end text-danger" id="mp-share-manual"></td></tr>
                    <tr class="fw-bold"><td>Total</td><td class="text-end" id="mp-total-contract"></td><td class="text-end text-danger" id="mp-total-manual"></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="mp-confirm">Start manual flight</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ---- what the server does not give yet: a red TODO on the screen and a line of the list at the bottom of the page

    const todos = new Set();

    function todo(what) {
        todos.add(what);
        return '<span class="todo" title="' + esc(what) + '">TODO</span>';
    }

    // ---- the times of the flight: 'hh:mm' or 'hh:mm+1' (the next day) -> minutes

    function minutesOf(t) {
        const m = /^(\d\d):(\d\d)(?:\+(\d+))?$/.exec(t || '');
        return m ? (m[3] ? Number(m[3]) * 1440 : 0) + Number(m[1]) * 60 + Number(m[2]) : null;
    }

    // blocks off, take off, landing and blocks on: planned or estimated (grey italic), or the time which has happened (bold)
    function timeOf(f, key) {
        const fact = {off: f.adep, tkf: f.atkf, ldg: f.aldg, on: f.aarr}[key];
        const est = {off: null, tkf: f.etkf, ldg: f.eldg, on: f.earr}[key];
        const plan = {off: f.pdep, tkf: null, ldg: null, on: f.parr}[key];
        if (fact) {
            return {text: fact, kind: 'fact', plan: plan};
        }
        return est ? {text: est, kind: 'plan', plan: null} : {text: plan, kind: 'plan', plan: null};
    }

    // the italic grey time is the planned one, the tooltip says so
    const planTitle = t => t.kind === 'fact' ? '' : ' title="Planned time"';

    const timeSpan = t => '<span class="' + (t.kind === 'fact' ? 't-fact' : 't-plan') + '"' + planTitle(t) + '>' + esc(t.text ?? '--:--') + '</span>';

    const LABELS = {off: 'Blocks off', tkf: 'Take off', ldg: 'Landing', on: 'Blocks on'};

    const timeTile = (f, key) => {
        const t = timeOf(f, key);
        return {label: LABELS[key], html: '<div class="stat-value big ' + (t.kind === 'fact' ? 't-fact' : 't-plan') + '"' + planTitle(t) + '>' + esc(t.text ?? '--:--') + '</div>',
            hint: t.kind === 'fact' ? (t.plan && t.plan !== t.text ? 'planned ' + esc(t.plan) : 'actual') : 'planned'};
    };

    // the same times squeezed into two tiles
    const departureTile = f => ({label: 'Departure', html: '<div class="time-lines"><div><span class="k">Blocks off</span>' + timeSpan(timeOf(f, 'off')) + '</div>'
        + '<div><span class="k">Take off</span>' + timeSpan(timeOf(f, 'tkf')) + '</div></div>'});
    const arrivalTile = f => ({label: 'Arrival', html: '<div class="time-lines"><div><span class="k">Landing</span>' + timeSpan(timeOf(f, 'ldg')) + '</div>'
        + '<div><span class="k">Blocks on</span>' + timeSpan(timeOf(f, 'on')) + '</div></div>'});

    // ---- the tiles of the flight

    const STAGE_NAMES = {Dispatched: 'Dispatched', Preflight: 'Preflight', Departure: 'Departure', Flying: 'Flying', Arrival: 'Arrival', Postflight: 'Postflight', Finished: 'Finished'};

    const stageTile = f => ({label: 'Flight stage', value: esc(STAGE_NAMES[f.fmSt] ?? f.fmSt), cls: 'big'});
    // The aircraft of the flight: the tail number and the type on one line
    const aircraftTile = f => ({label: 'Aircraft', html: '<div class="stat-value big">' + esc(f.acRg ?? '---') + ' <span class="t-plan">' + esc(f.acTp ?? '') + '</span></div>'});

    // Where the pilot is and whether it is right: the state of the pilot of the user (the same states which block the actions)
    function pilotTile(status) {
        const p = status.pilot;
        if (!p) {
            return {label: 'Pilot', value: '---', cls: 'big t-plan'};
        }
        const where = p.expectedAirport ?? p.expectedCity ?? '---';
        switch (p.state) {
            case 'OK':
                return {label: 'Pilot', value: esc(where), cls: 'big good', hint: 'the location is correct'};
            case 'WRONG_AIRPORT':
                return {label: 'Pilot', value: esc(where), cls: 'big bad', hint: 'the sim puts the aircraft at ' + esc(p.currentAirport ?? '?')};
            case 'PERSON_IN_CITY':
                return {label: 'Pilot', value: esc(where), cls: 'big bad', hint: 'in a city, not at an airport'};
            case 'PERSON_NOT_AT_AIRPORT':
                return {label: 'Pilot', value: '---', cls: 'big bad', hint: 'not at an airport'};
            case 'PERSON_NOT_IDLE':
                return {label: 'Pilot', value: esc(where), cls: 'big bad', hint: 'busy (resting, travelling or on duty)'};
            case 'NO_PERSON':
                return {label: 'Pilot', value: 'no pilot', cls: 'big bad'};
            default:
                return {label: 'Pilot', value: esc(where), cls: 'big', hint: esc(p.state)};
        }
    }

    // Without a flight: the two tiles which say what to do. The pilot with the link to his page (to fix what is wrong), the flight with the link to the booking.
    function noFlightRow(status) {
        const pilot = pilotTile(status);
        pilot.hint = (pilot.hint ? pilot.hint + '<br>' : '') + '<a href="pilot.html">Open the pilot page</a>';
        pilot.span2 = true;
        pilot.alert = !status.pilot || status.pilot.state !== 'OK';
        return [{label: 'Flight', value: 'No active flight', cls: 'big t-plan', hint: 'Nothing to fly now. <a href="busy-birds.html">Book a mission</a>', span2: true, alert: true}, pilot];
    }

    // The double header of the page: the small title is the page, the big one is the route of the flight (the avatar is the pilot's)
    function renderHeader(status) {
        const f = status.flight;
        $('#pageHeader').html(pilotHeader({kind: 'Flight Dashboard', title: f ? esc(f.dep) + ' → ' + esc(f.dest) : 'No active flight', avatarImage: lastPilot ? lastPilot.avatarImage : null}));
    }

    // The first tile of the second row, always Payload. Ferry: Ferry flight. Revenue: until the end of the boarding the sold tickets and PAX as TBD, after
    // the boarding PAX, in the deboarding Carried PAX.
    function payloadTile(f) {
        if (f.tfId === null || f.tfId === undefined) {
            return {label: 'Payload', value: 'Ferry flight', cls: 'big ferry'};
        }
        const lines = list => ({label: 'Payload', html: '<div class="count-lines">' + list.map(l => '<div><span class="k">' + l[0] + '</span><b>' + l[1] + '</b></div>').join('') + '</div>'});
        switch (f.tfSt) {
            case 'Scheduled':
            case 'CheckIn':
            case 'WaitingForBoarding':
            case 'Boarding':
                // the progress of the check-in and of the boarding is in their own tiles, PAX is known only when the boarding is over
                return {label: 'Payload', html: '<div class="count-lines"><div><span class="k">Sold tickets</span><b>' + f.stkts + '</b></div>'
                        + '<div><span class="k">PAX</span><b title="Will be known at the end of the boarding">TBD</b></div></div>'};
            case 'Deboarding':
            case 'Finished':
                // the number of those who were carried is not in the status: the checked-in ones are about it
                return {label: 'Payload', html: '<div class="count-lines"><div><span class="k">Carried PAX</span><b>' + f.ckdIn + '</b> '
                        + todo('the exact number of the carried passengers (the status has the checked-in ones)') + '</div></div>'};
            default:
                return {label: 'Payload', html: '<div class="stat-value big">PAX ' + f.ponBrd + '</div>'};
        }
    }

    // The check-in goes by itself, the time is counted from the planned departure: it does not depend on the start of the flight. BusyBirds close it when
    // everyone who booked has checked in, so the tile shows the progress (checked in / sold), not the time of the end.
    function checkInTile(f) {
        if (f.tfSt === 'CheckIn') {
            return {label: 'Check-in', value: f.ckdIn + ' / ' + f.stkts, cls: 'big good', hint: 'checked in'};
        }
        if (f.tfSt !== 'Scheduled') {
            return {label: 'Check-in', value: f.ckdIn + ' / ' + f.stkts, cls: 'big', hint: 'checked in'};
        }
        return {label: 'Check-in', html: '<div class="stat-value big">' + todo('the time of the start of the check-in') + '</div>', hint: 'starts at'};
    }

    // The boarding can not begin before the start of the flight, the pilot starts it with the button.
    function boardingTile(f) {
        if (f.tfSt === 'Boarding') {
            return {label: 'Boarding', value: f.ponBrd + ' / ' + f.ckdIn, cls: 'big good', hint: 'ends at ' + todo('the time of the end of the boarding')};
        }
        if (f.fmSt === 'Dispatched') {
            return {label: 'Boarding', value: 'after the start', cls: 'big t-plan', hint: 'not before Start flight'};
        }
        return {label: 'Boarding', value: 'WAITING', cls: 'big t-plan', hint: 'start it when you are ready'};
    }

    function deboardingTile(f) {
        if (f.tfSt === 'Deboarding') {
            return {label: 'Deboarding', value: f.ponBrd + ' left', cls: 'big good', hint: 'ends at ' + todo('the time of the end of the deboarding')};
        }
        return {label: 'Deboarding', value: 'WAITING', cls: 'big t-plan', hint: 'starts at your discretion'};
    }

    // The mode of the tracking and the state of the sim: the last tile of the first row
    function trackingTile(status) {
        const sim = status.sim || {};
        const f = status.flight;
        const mode = status.mode === 'SIM_TRACKER' ? 'Sim tracker' : status.mode === 'MANUAL' ? 'Manual' : f ? (sim.status === 'Connected' ? 'Choose at start' : 'Manual only') : '---';
        const details = [];
        details.push('Sim ' + esc(sim.status ?? '---'));
        if (sim.locationStatus) {
            details.push(esc(sim.locationStatus) + (sim.airportIcao ? ' ' + esc(sim.airportIcao) : ''));
        }
        if (sim.parkingBrake !== null && sim.parkingBrake !== undefined) {
            details.push('P/B ' + (sim.parkingBrake ? 'SET' : 'OFF'));
        }
        if (sim.engineRunning !== null && sim.engineRunning !== undefined) {
            details.push('ENG ' + (sim.engineRunning ? 'RUN' : 'OFF'));
        }
        if (sim.measuredGs) {
            details.push('G/S ' + esc(sim.measuredGs));
        }
        const good = status.mode === 'SIM_TRACKER' && sim.status === 'Connected';
        return {label: 'Tracking', value: mode, cls: 'big' + (good ? ' good' : ''), hint: details.join(' &middot; ') + '<div>updated ' + new Date().toISOString().slice(11, 19) + 'Z</div>'};
    }

    // all four times in one tile (a place is saved for the check-in)
    const timesTile = f => ({label: 'Times', html: '<div class="time-lines">' + [['off', 'Blocks off'], ['tkf', 'Take off'], ['ldg', 'Landing'], ['on', 'Blocks on']]
        .map(k => '<div><span class="k">' + k[1] + '</span>' + timeSpan(timeOf(f, k[0])) + '</div>').join('') + '</div>'});

    const placeholder = () => ({label: '', value: '', placeholder: true});

    // blocks off to blocks on, the times on two lines
    function flightTimeTile(f) {
        const a = minutesOf(f.adep), b = minutesOf(f.aarr);
        return {label: 'Flight time', html: '<div class="stat-value big">' + (a !== null && b !== null ? formatClock(b - a) : '--:--') + '</div>'
            + '<div class="time-lines"><div><span class="k">Blocks off</span>' + esc(f.adep ?? '--:--') + '</div><div><span class="k">Blocks on</span>' + esc(f.aarr ?? '--:--') + '</div></div>'};
    }

    // from Start flight to Finish flight, the times on two lines
    function dutyTimeTile() {
        return {label: 'Duty time', html: '<div class="stat-value big">' + todo('the times of the start and of the finish of the flight') + '</div>'
            + '<div class="time-lines"><div><span class="k">Started</span>' + todo('the time of Start flight') + '</div><div><span class="k">Finished</span>' + todo('the time of Finish flight') + '</div></div>'};
    }

    // the limits of the pilot, they are shown before the start of the flight only
    // (a tile over its limit stops the start of the flight, it is pale red as the other tiles with a problem)
    const limitTiles = p => p ? [awakeTile(p, false), dutyTile(p), flightTime30Tile(p), flightTime365Tile(p)].map(t => Object.assign(t, {alert: t.over === true})) : [];

    // The rows of the tiles for the stage of the flight. The first row: flight stage, aircraft, pilot, tracking (the route is in the header). The second row starts with the payload, the rest depends on the stage.
    function buildRows(f, pilot, status) {
        const rows = [[stageTile(f), aircraftTile(f), pilotTile(status), trackingTile(status)]];
        const passenger = f.tfId !== null && f.tfId !== undefined;
        const tf = f.tfSt;
        const payload = payloadTile(f);

        if (f.fmSt === 'Finished') {
            rows.push([payload, departureTile(f), arrivalTile(f), flightTimeTile(f)]);
            rows.push([dutyTimeTile()]);
            return rows;
        }

        const afterArrival = f.fmSt === 'Postflight' || tf === 'WaitingForDeboarding' || tf === 'Deboarding';
        const checkIn = passenger && (tf === 'Scheduled' || tf === 'CheckIn');
        const boarding = passenger && (checkIn || tf === 'WaitingForBoarding' || tf === 'Boarding');
        if (afterArrival) {
            const row = [payload, departureTile(f), arrivalTile(f)];
            row.push(passenger ? deboardingTile(f) : placeholder());
            rows.push(row);
        } else if (checkIn || boarding) {
            // the payload and the check-in take places, with the check-in the four times are squeezed into one tile
            const row = [payload];
            if (checkIn) {
                row.push(checkInTile(f), boardingTile(f), timesTile(f));
            } else {
                row.push(boardingTile(f), departureTile(f), arrivalTile(f));
            }
            rows.push(row);
        } else {
            rows.push([payload, departureTile(f), arrivalTile(f), placeholder()]);
        }

        if (f.fmSt === 'Dispatched' && pilot) {
            rows.push(limitTiles(pilot));
        }
        return rows;
    }

    function tileHtml(t) {
        return '<div class="' + (t.span2 ? 'tile-2' : '') + '"><div class="stat' + (t.placeholder ? ' stat-placeholder' : '') + (t.alert ? ' stat-alert' : '') + '">'
            + '<div class="stat-label">' + esc(t.label) + '</div>'
            + (t.html !== undefined ? '<div class="stat-small">' + t.html + '</div>' : '<div class="stat-value ' + (t.cls || '') + '">' + t.value + '</div>')
            + (t.hint ? '<div class="stat-hint">' + t.hint + '</div>' : '')
            + '</div></div>';
    }

    const rowHtml = row => '<div class="tile-grid">' + row.map(tileHtml).join('') + '</div>';

    // ---- the actions of the stage (the same rules as flight-dashboard.html)

    // The steps which the tracker does itself in the SIM_TRACKER mode
    const TRACKED_ACTIONS = ['blocks-off', 'takeoff', 'landing', 'blocks-on'];
    const ACTION_LABELS = {
        'start-flight': 'Start tracked flight', 'start-flight-manual': 'Start manual flight', 'start-boarding': 'Start Boarding', 'blocks-off': 'Blocks Off',
        'takeoff': 'Takeoff', 'landing': 'Landing', 'blocks-on': 'Blocks On', 'start-deboarding': 'Start Deboarding', 'finish-flight': 'Finish Flight'
    };
    const ACTION_REQUESTS = {
        'start-flight': {url: 'start-flight', params: {mode: 'tracker'}},
        'start-flight-manual': {url: 'start-flight', params: {mode: 'manual'}}
    };
    const STAGE_TITLES = {
        Dispatched: 'Before Start Flight', Preflight: 'Preflight', Departure: 'Departure', Flying: 'Flying', Arrival: 'Arrival', Postflight: 'Postflight', Finished: 'The flight is finished'
    };
    // The server refuses the actions in these states of the pilot of the user (403). PERSON_IN_CITY does not block the dashboard, but the start needs the airport.
    const BLOCKING_USER_STATES = ['NO_PERSON', 'PERSON_NOT_IDLE', 'PERSON_NOT_AT_AIRPORT', 'WRONG_AIRPORT'];

    function isBlocked(status, actionName) {
        const state = status.pilot && status.pilot.state;
        if (actionName === 'start-flight-manual' && state === 'WRONG_AIRPORT') {
            return false;
        }
        return BLOCKING_USER_STATES.includes(state);
    }

    function userStateMessage(pilot) {
        switch (pilot && pilot.state) {
            case 'NO_PERSON': return 'You have no pilot (person), flying is not available.';
            case 'PERSON_NOT_IDLE': return 'Your pilot is busy now (resting, travelling or on duty), flying is not available.';
            case 'PERSON_NOT_AT_AIRPORT': return 'Your pilot is not at an airport, flying is not available.';
            case 'WRONG_AIRPORT': return 'Your pilot is expected at ' + esc(pilot.expectedAirport ?? '?') + ' but the simulator puts the aircraft at ' + esc(pilot.currentAirport ?? '?') + '.';
            default: return null;
        }
    }

    // The area under the tiles: the title of the stage, the conditions of the actions and the buttons.
    function areaHtml(status) {
        const f = status.flight;
        if (f === null) {
            return '';
        }
        if (f.fmSt === 'Finished') {
            return '<div class="action-area"><div class="action-title">' + STAGE_TITLES.Finished + '</div>'
                + '<div class="action-buttons"><a class="btn btn-outline-secondary" href="pilot.html">To the pilot</a> <a class="btn btn-primary" href="busy-birds.html">Book another mission</a></div></div>';
        }

        const manual = status.mode === 'MANUAL';
        const actions = (status.actions ?? []).filter(a => a.name !== 'reschedule');
        const bothStarts = actions.some(a => a.name === 'start-flight') && actions.some(a => a.name === 'start-flight-manual');
        let checks = '';
        let buttons = '';

        actions.forEach(a => {
            if (TRACKED_ACTIONS.includes(a.name) && !manual) {
                buttons += '<button class="btn btn-outline-primary disabled">' + esc(ACTION_LABELS[a.name]) + ' will be tracked automatically</button>';
                return;
            }
            const label = ACTION_LABELS[a.name] ?? a.name;
            const allowed = a.allowed && !isBlocked(status, a.name);
            const style = allowed ? (a.name === 'start-flight-manual' && bothStarts ? 'btn-outline-success' : 'btn-success') : 'btn-outline-danger disabled';
            buttons += '<button class="btn action-button ' + style + '" data-action="' + esc(a.name) + '"' + (allowed ? '' : ' disabled') + '>' + esc(label) + '</button>';
            // the conditions of an action which cannot be done now, and of a start in any case
            const list = a.checks ?? [];
            if (list.length > 0 && (!allowed || a.name === 'start-flight' || a.name === 'start-flight-manual')) {
                checks += '<li class="fw-semibold">' + esc(label) + '</li>' + list.map(c => '<li class="' + (c.result ? 'ok' : 'no') + '">' + esc(c.name) + '</li>').join('');
            }
        });
        if (bothStarts) {
            checks += '<li class="text-secondary">Tracked: Blocks Off, Takeoff, Landing and Blocks On follow the sim. Manual: you press the buttons.</li>';
        }
        if (f.fmSt === 'Postflight' && f.autoFinish) {
            buttons += '<button class="btn btn-outline-primary disabled">The flight will be finished automatically after the passengers have got off</button>';
        }
        if (status.mode === 'SIM_TRACKER' && buttons === '') {
            const note = {Departure: 'Takeoff will be tracked automatically', Flying: 'Landing will be tracked automatically', Arrival: 'Blocks On will be tracked automatically'}[f.fmSt];
            if (note) {
                buttons += '<button class="btn btn-outline-primary disabled">' + note + '</button>';
            }
        }

        return '<div class="action-area"><div class="action-title">' + esc(STAGE_TITLES[f.fmSt] ?? f.fmSt) + '</div>'
            + (checks ? '<ul class="checks">' + checks + '</ul>' : '')
            + '<div class="action-buttons">' + buttons + '</div></div>';
    }

    // ---- the page

    let lastStatus = null;
    let lastPilot = null;
    let flightId = null;
    let actionInProgress = false;
    let actionMessage = null;
    let stub = null;

    function render() {
        const status = lastStatus;
        if (!status) {
            return;
        }
        todos.clear();
        flightId = status.flight ? status.flight.fmId : null;

        let banners = '';
        if (status.mode === 'SIM_TRACKER' && status.sim && status.sim.status !== 'Connected') {
            banners += '<div class="alert alert-warning py-2">The sim tracker is not connected: there were no reports from the sim for a while.</div>';
        }
        // without a flight the tile of the pilot says the same
        const warning = status.flight === null ? null : userStateMessage(status.pilot);
        if (warning) {
            banners += '<div class="alert alert-danger py-2">' + warning + '</div>';
        }
        if (actionMessage) {
            banners += '<div class="alert alert-' + (actionMessage.error ? 'danger' : 'secondary') + ' py-2">' + esc(actionMessage.text) + '</div>';
        }
        $('#banners').html(banners);
        renderHeader(status);

        $('#tiles').html(status.flight === null ? rowHtml(noFlightRow(status)) : buildRows(status.flight, lastPilot, status).map(rowHtml).join(''));
        $('#area').html(areaHtml(status));
        $('#todoList').html(todos.size === 0 ? '' : '<div class="todo">TODO for the server:</div><ul class="todo mb-0">' + [...todos].map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>');

        $('.action-button').on('click', function () {
            const name = $(this).data('action');
            if (name === 'start-flight-manual') {
                startManualFlightAfterTheQuestion();
            } else {
                sendAction(name);
            }
        });
    }

    function loadStatus() {
        airwaysAuth('GET', '/flight-dashboard/status', {}, function (response) {
            lastStatus = response;
            render();
        }, function () {
            actionMessage = {text: 'Failed to load the status', error: true};
            render();
        });
    }

    function loadPilot() {
        airwaysAuth('GET', '/pilot', {}, function (p) {
            lastPilot = p;
            render();
        }, function () { /* the limits are not shown without the pilot */ });
    }

    // POST /flight-dashboard/<action>, the answer is the whole new status
    function sendAction(actionName) {
        if (actionInProgress || flightId === null || stub !== null) {
            return;
        }
        actionInProgress = true;
        actionMessage = {text: (ACTION_LABELS[actionName] ?? actionName) + '...', error: false};
        render();
        const request = ACTION_REQUESTS[actionName] ?? {url: actionName, params: {}};
        airwaysAuth('POST', '/flight-dashboard/' + request.url, Object.assign({flightId: flightId}, request.params), function (response) {
            actionInProgress = false;
            actionMessage = null;
            lastStatus = response;
            render();
            loadPilot();
        }, function (e) {
            actionInProgress = false;
            const code = e && e.status ? 'HTTP ' + e.status : 'no connection';
            const reason = e && e.responseJSON && e.responseJSON.message ? ': ' + e.responseJSON.message : '';
            actionMessage = {text: 'The action was refused (' + code + reason + ')', error: true};
            loadStatus();
        });
    }

    const pay = n => Number(n).toLocaleString('en-US');
    let manualPayModal;

    function startManualFlightAfterTheQuestion() {
        if (actionInProgress || flightId === null || stub !== null) {
            return;
        }
        airwaysAuth('GET', '/flight-dashboard/manual-pay', {flightId: flightId}, function (r) {
            if (!r || !r.hasContract) {
                sendAction('start-flight-manual');
                return;
            }
            $('#mp-flight-contract').text(pay(r.byContract.flightPay));
            $('#mp-flight-manual').text(pay(r.ifManual.flightPay));
            $('#mp-share-contract').text(pay(r.byContract.incomeShare));
            $('#mp-share-manual').text(pay(r.ifManual.incomeShare));
            $('#mp-total-contract').text(pay(r.byContract.total));
            $('#mp-total-manual').text(pay(r.ifManual.total));
            manualPayModal.show();
        }, function () {
            sendAction('start-flight-manual');
        });
    }

    // ---- stub data of the stages (?stub=before-start), shaped like the answers of the server: the page shows them without the server

    function stubStatus(name) {
        if (name === 'no-flight') {
            return {mode: null, actions: [], sim: {status: 'Connected'}, flight: null, pilot: {state: 'PERSON_NOT_IDLE'}};
        }
        const f = {dep: 'KAUS', dest: 'MMMX', fmId: '1', fmSt: 'Dispatched', tfId: 't1', tfSt: 'Scheduled', pdep: '19:05', parr: '20:51', etkf: '19:15', eldg: '20:41', earr: '20:51',
            acRg: 'N172SP', acTp: 'C172', adep: null, atkf: null, aldg: null, aarr: null, stkts: 153, ttkts: 220, ckdIn: 0, ponBrd: 0, autoFinish: true};
        const dutyOk = name !== 'over-limit';
        const limits = [{name: 'The awake time is within the limit (the pilot is not overtired)', result: true},
            {name: 'The duty time in 24 hours is within the limit', result: dutyOk},
            {name: 'The flight time in 30 days is within the limit', result: true},
            {name: 'The flight time in 365 days is within the limit', result: true}];
        let actions = [{name: 'start-flight', allowed: dutyOk, checks: [{name: 'The pilot is at the departure airport KAUS', result: true}, {name: 'The aircraft is idle at the departure airport KAUS', result: true}, ...limits]},
            {name: 'start-flight-manual', allowed: dutyOk, checks: [{name: 'The pilot is at the departure airport KAUS', result: true}, ...limits]}];
        let mode = null;
        switch (name) {
            case 'check-in':
                Object.assign(f, {fmSt: 'Preflight', tfSt: 'CheckIn', ckdIn: 87});
                actions = [{name: 'start-boarding', allowed: true, checks: []}];
                mode = 'SIM_TRACKER';
                break;
            case 'boarding':
                Object.assign(f, {fmSt: 'Preflight', tfSt: 'Boarding', ckdIn: 151, ponBrd: 112});
                actions = [];
                mode = 'SIM_TRACKER';
                break;
            case 'departure':
                Object.assign(f, {fmSt: 'Departure', tfSt: 'WaitingForDeparture', ckdIn: 151, ponBrd: 151, adep: '19:07'});
                actions = [];
                mode = 'SIM_TRACKER';
                break;
            case 'flying':
                Object.assign(f, {fmSt: 'Flying', tfSt: 'Flying', ckdIn: 151, ponBrd: 151, adep: '19:07', atkf: '19:18'});
                actions = [];
                mode = 'SIM_TRACKER';
                break;
            case 'ferry':
                Object.assign(f, {fmSt: 'Flying', tfId: null, tfSt: null, dep: 'KEDC', dest: 'KAUS', adep: '10:06', atkf: '10:17', pdep: '10:05', parr: '10:39', etkf: '10:15', eldg: '10:29', earr: '10:39'});
                actions = [];
                mode = 'MANUAL';
                break;
            case 'arrived':
                Object.assign(f, {fmSt: 'Postflight', tfSt: 'WaitingForDeboarding', ckdIn: 151, ponBrd: 151, adep: '19:07', atkf: '19:18', aldg: '20:51', aarr: '20:59'});
                actions = [{name: 'start-deboarding', allowed: true, checks: []}];
                mode = 'SIM_TRACKER';
                break;
            case 'deboarding':
                Object.assign(f, {fmSt: 'Postflight', tfSt: 'Deboarding', ckdIn: 151, ponBrd: 64, adep: '19:07', atkf: '19:18', aldg: '20:51', aarr: '20:59'});
                actions = [];
                mode = 'SIM_TRACKER';
                break;
            case 'finished':
                Object.assign(f, {fmSt: 'Finished', tfSt: 'Finished', ckdIn: 151, ponBrd: 0, adep: '19:07', atkf: '19:18', aldg: '20:51', aarr: '20:59'});
                actions = [];
                mode = 'SIM_TRACKER';
                break;
            default:
                break;
        }
        return {mode: mode, actions: actions, sim: {status: 'Connected', locationStatus: 'At airport', airportIcao: 'KAUS', parkingBrake: true, engineRunning: false, measuredGs: '0'},
            flight: f, pilot: {state: 'OK', expectedAirport: 'KAUS', currentAirport: 'KAUS'}};
    }

    const STUB_PILOT = {state: 'Idle', awake: {creditMinutes: 600, sleeping: false}, duty: {last24HoursMinutes: 200, limitMinutes: 840},
        flightTime: {last30DaysMinutes: 745, limit30DaysMinutes: 4800, last365DaysMinutes: 14406, limit365DaysMinutes: 48000}};

    $(function () {
        initSiteMenu('flight-dashboard-tile'); // the page is not in the menu: no item is marked
        manualPayModal = new bootstrap.Modal(document.getElementById('manualPayModal'));
        $('#mp-confirm').on('click', function () {
            manualPayModal.hide();
            sendAction('start-flight-manual');
        });

        stub = new URLSearchParams(location.search).get('stub');
        if (stub !== null) {
            lastStatus = stubStatus(stub);
            // over-limit: before the start, the duty time is over its limit (the awake and the flight time are fine)
            lastPilot = stub === 'over-limit' ? Object.assign({}, STUB_PILOT, {duty: {last24HoursMinutes: 890, limitMinutes: 840}}) : STUB_PILOT;
            render();
            return;
        }
        loadStatus();
        loadPilot();
        setInterval(function () {
            if (!actionInProgress) {
                loadStatus();
            }
        }, 10000);
        setInterval(loadPilot, 30000);
    });
</script>
</body>
</html>
