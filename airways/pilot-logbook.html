<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Logbook</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    // GET /pilot/logbook (token of the user): the flights of the pilot of the user, the latest first, with the totals
    function hours(value) {
        return value > 0 ? value.toFixed(1) : '<span class="text-secondary">—</span>';
    }

    // the error of the page without the "Back to map" link of the common showError
    function showPageError(message) {
        $('#page').html(`<div class="alert alert-warning fs-5">${esc(message)}</div>`);
    }

    function airportLink(icao) {
        return icao ? `<a class="entity-link" href="${airportUrl(icao)}">${esc(icao)}</a>` : '—';
    }

    function renderLogbook(logbook) {
        const t = logbook.totals;

        const rows = logbook.entries.map(e => [
            `<span class="text-nowrap">${esc(e.date)}</span>`,
            esc(e.regNo ?? '—') + (e.aircraftType ? ` <span class="text-secondary">${esc(e.aircraftType)}</span>` : ''),
            airportLink(e.from),
            airportLink(e.to),
            esc(e.blocksOff ?? '—'),
            esc(e.blocksOn ?? '—'),
            e.flightTime.toFixed(1),
            hours(e.nightTime),
            hours(e.ifrTime),
            `${e.dayTakeoffs}/${e.nightTakeoffs}`,
            `${e.dayLandings}/${e.nightLandings}`
        ]);

        $('#page').html(`
            ${entityHeader({kind: 'Pilot', title: 'Logbook'})}

            ${statTiles([
                {label: 'Flights', value: fmtNumber(t.flights)},
                {label: 'Flight time', value: t.flightTime.toFixed(1), hint: 'hours'},
                {label: 'Night', value: t.nightTime.toFixed(1), hint: 'hours'},
                {label: 'IFR', value: t.ifrTime.toFixed(1), hint: 'hours'},
                {label: 'Takeoffs', value: `${t.dayTakeoffs} / ${t.nightTakeoffs}`, hint: 'day / night'},
                {label: 'Landings', value: `${t.dayLandings} / ${t.nightLandings}`, hint: 'day / night'}
            ])}

            ${section('Flights', dataTable([
                {title: 'Date (UTC)'},
                {title: 'Aircraft'},
                {title: 'From'},
                {title: 'To'},
                {title: 'Off', cls: 'text-end'},
                {title: 'On', cls: 'text-end'},
                {title: 'Flight', cls: 'text-end'},
                {title: 'Night', cls: 'text-end'},
                {title: 'IFR', cls: 'text-end'},
                {title: 'T/O D/N', cls: 'text-end'},
                {title: 'Ldg D/N', cls: 'text-end'}
            ], rows, 'No flights yet'), {count: logbook.entries.length})}
        `);
    }

    $(document).ready(function () {
        showLoading();
        airwaysAuth('GET', '/pilot/logbook', {}, renderLogbook, function (e) {
            if (e && e.status === 401) {
                showPageError('Not signed in: check the token in localStorage (airwaysToken)');
            } else if (e && e.status === 404) {
                showPageError('You have no pilot yet, so there is no logbook');
            } else {
                showPageError('Failed to load the logbook');
            }
        });
    });
</script>

</body>
</html>
