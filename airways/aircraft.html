<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Aircraft</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    function locationTile(ac) {
        if (ac.airport) {
            return airportRef(ac.airport, false);
        }
        if (ac.currentFlight) {
            return '<span class="fs-5">En route</span>';
        }
        return '—';
    }

    function currentFlightSection(ac) {
        const f = ac.currentFlight;
        if (!f) {
            return '';
        }

        const start = new Date(f.atd ?? f.std).getTime();
        const end = new Date(f.eta ?? f.sta).getTime();
        const progress = f.atd ? Math.max(0, Math.min(100, (Date.now() - start) / (end - start) * 100)) : 0;

        const routeEnd = (airport, label, time) => `
            <div class="route-airport">
                <div class="text-secondary small">${label}</div>
                <div class="icao">${flagImg(airport.country, 32)} <a class="entity-link" href="${airportUrl(airport.icao)}">${esc(airport.icao)}</a></div>
                <div class="text-secondary">${esc(airport.name ?? '')}</div>
                <div class="fs-5 mt-1">${time}</div>
            </div>`;

        const pos = ac.position;
        const facts = [
            ['Altitude', pos?.alt !== undefined && pos?.alt !== null ? fmtNumber(pos.alt) + ' ft' : '—'],
            ['Heading', pos?.hdg !== undefined && pos?.hdg !== null ? pos.hdg + '&deg;' : '—'],
            ['PAX', fmtNumber(f.pax)]
        ];

        return section('Current flight', `
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    ${routeEnd(f.from, 'FROM', timeCell(f.std, f.atd, null))}
                    <div class="text-end">${routeEnd(f.to, 'TO', timeCell(f.sta, null, f.eta))}</div>
                </div>
                <div class="progress route-progress my-3" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" style="width: ${progress}%"></div>
                </div>
                <div class="d-flex gap-4">
                    ${facts.map(([label, value]) => `<div><div class="stat-label">${label}</div><div class="fs-5 fw-semibold">${value}</div></div>`).join('')}
                </div>
            </div>`, {stub: isStub(ac, 'currentFlight')});
    }

    function renderAircraft(ac) {
        document.title = `airways / ${ac.reg}`;

        const flightRows = ac.recentFlights.map(f => [
            `<span class="text-secondary">${fmtDay(f.atd ?? f.std)}</span>`,
            airportRef(f.from, false),
            airportRef(f.to, false),
            timeCell(f.std, f.atd, null),
            timeCell(f.sta, f.ata, null),
            fmtDuration(f.minutes)
        ]);

        $('#page').html(`
            ${entityHeader({
                kind: 'Aircraft',
                title: esc(ac.reg),
                subtitle: [esc(ac.type), `${flagImg(ac.operator?.country)} ${esc(ac.operator?.name ?? '')}`]
                    .filter(s => s.trim()).join(' &middot; '),
                aside: [statusBadge(ac.opStatus), statusBadge(ac.locationStatus)].join(' ')
            })}

            ${statTiles([
                {label: 'Status', value: esc(ac.locationStatus ?? '—'), hint: esc(ac.opStatus ?? '')},
                {label: 'Location', value: locationTile(ac)},
                {label: 'Flight time', value: esc(ac.totals.flightTime ?? '—'), hint: 'hours'},
                {label: 'Cycles', value: fmtNumber(ac.totals.cycles)}
            ])}

            ${currentFlightSection(ac)}

            ${section('Recent flights', dataTable([
                {title: 'Date'},
                {title: 'From'},
                {title: 'To'},
                {title: 'Dep', cls: 'text-end'},
                {title: 'Arr', cls: 'text-end'},
                {title: 'Time', cls: 'text-end'}
            ], flightRows, 'No flights yet'), {count: ac.recentFlights.length, stub: isStub(ac, 'recentFlights')})}

            ${ac.lastUpdate ? `<div class="text-secondary small mb-1">Updated ${esc(ac.lastUpdate.replace('T', ' '))}</div>` : ''}
            ${stubNote(ac)}
        `);
    }

    $(document).ready(function () {
        const id = queryParam('id');
        if (!id) {
            showError('Aircraft id is not specified');
            return;
        }

        // the first load shows the loading/error states, the following ones silently replace the data
        const load = initial => loadAircraftDetails(id)
            .then(ac => {
                if (!ac) {
                    if (initial) {
                        showError(`Aircraft '${id}' not found`);
                    }
                    return;
                }
                preserveScroll(() => renderAircraft(ac));
            })
            .catch(e => {
                if (initial) {
                    showError(e.message);
                } else {
                    console.warn('refresh failed', e);
                }
            });

        showLoading();
        load(true).then(() => startAutoRefresh(() => load(false)));
    });
</script>

</body>
</html>
