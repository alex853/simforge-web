<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Qualifications</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>

    <style>
        .criterion-ok { color: var(--bs-success); font-weight: 700; }
        .criterion-no { color: #fd7e14; font-weight: 700; }
        .totals-col { color: var(--bs-secondary-color); }
    </style>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    // GET /pilot/qualifications (token of the user): the totals of the logbook and the currency of the pilot on every type of aircraft of the logbook.
    // Three criteria of a type, each is a green tick (met) or an orange cross (not met); the totals of the type are not used in them. The type
    // currency has two conditions: flights and hours of the last 12 months, the tick is by the hours of the last 12 months.

    // the error of the page without the "Back to map" link of the common showError
    function showPageError(message) {
        $('#page').html(`<div class="alert alert-warning fs-5">${esc(message)}</div>`);
    }

    // 24 -> '24 h', 48 -> '2 d', 2160 -> '90 d'
    function windowText(hours) {
        return hours >= 48 && hours % 24 === 0 ? (hours / 24) + ' d' : hours + ' h';
    }

    // a column title with a small second line
    function title(main, hint) {
        return main + '<br><span class="text-secondary fw-normal">' + hint + '</span>';
    }

    // the mark of a criterion: a green tick or an orange cross, the tooltip tells what the criterion is
    function mark(ok, tooltip) {
        return ok
            ? '<span class="criterion-ok" title="' + esc(tooltip) + '">&#10003;</span>'
            : '<span class="criterion-no" title="' + esc(tooltip) + '">&#10007;</span>';
    }

    // 0, I, II, III, IV, V
    function roman(level) {
        return ['0', 'I', 'II', 'III', 'IV', 'V'][level] ?? String(level);
    }

    // the cell of the experience level: the roman number and a mark (a tick from the level I, a cross at 0); the tooltip tells what the next level needs
    function experienceCell(a, levels) {
        const next = levels.find(l => l.level === a.experienceLevel + 1);
        const tooltip = 'Experience level ' + roman(a.experienceLevel) + ' (flights and hours on the type, both needed)'
            + (next ? '. Next, ' + roman(next.level) + ': ' + next.flights + ' flights and ' + next.hours + ' hours.' : '. The highest level.');
        return '<span class="fw-semibold">' + roman(a.experienceLevel) + '</span> ' + mark(a.experienceLevel >= 1, tooltip);
    }

    function renderQualifications(q) {
        const t = q.totals;
        const c = q.criteria;
        const recentLandings = windowText(q.recentLandingsWindowHours);
        const recentFlights = q.recentFlightsWindowDays >= 360 ? '12 months' : q.recentFlightsWindowDays + ' d';

        const rows = q.types.map(a => [
            '<span class="fw-semibold">' + esc(a.aircraftType) + '</span>',
            experienceCell(a, q.experienceLevels),
            fmtNumber(a.recentLandings) + ' ' + mark(a.canCarryPassengers,
                'Can carry passengers: ' + c.recentLandings + ' or more landings in the last ' + recentLandings),
            a.recentNightTakeoffs + ' / ' + a.recentNightLandings + ' ' + mark(a.nightFlying,
                'Night flying: at least ' + c.nightTakeoffs + ' night takeoff and ' + c.nightLandings + ' night landing in the last ' + recentLandings),
            fmtNumber(a.recentFlights),
            a.recentFlightTime.toFixed(1) + ' ' + mark(a.typeCurrent,
                'Type currency: ' + c.recentFlights + ' or more flights and ' + c.recentFlightHours + ' or more hours in the last ' + recentFlights),
            '<span class="totals-col">' + fmtNumber(a.landings) + '</span>',
            '<span class="totals-col">' + a.nightTakeoffs + ' / ' + a.nightLandings + '</span>',
            '<span class="totals-col">' + fmtNumber(a.flights) + '</span>',
            '<span class="totals-col">' + a.flightTime.toFixed(1) + '</span>'
        ]);

        $('#page').html(`
            ${entityHeader({kind: 'Pilot', title: 'Qualifications', aside: '<a class="entity-link" href="pilot-logbook.html">Logbook</a>'})}

            ${statTiles([
                {label: 'Flights', value: fmtNumber(t.flights)},
                {label: 'Flight time', value: t.flightTime.toFixed(1), hint: 'hours'},
                {label: 'Night', value: t.nightTime.toFixed(1), hint: 'hours'},
                {label: 'IFR', value: t.ifrTime.toFixed(1), hint: 'hours'},
                {label: 'Takeoffs', value: `${t.dayTakeoffs} / ${t.nightTakeoffs}`, hint: 'day / night'},
                {label: 'Landings', value: `${t.dayLandings} / ${t.nightLandings}`, hint: 'day / night'}
            ])}

            ${section('Aircraft type currency', dataTable([
                {title: 'Type'},
                {title: title('Experience', 'level'), cls: 'text-end'},
                {title: title('Landings', 'last ' + recentLandings + ' &middot; can carry passengers'), cls: 'text-end'},
                {title: title('Night T/O / ldg', 'last ' + recentLandings + ' &middot; night flying'), cls: 'text-end'},
                {title: title('Flights', recentFlights), cls: 'text-end'},
                {title: title('Hours', recentFlights + ' &middot; type currency'), cls: 'text-end'},
                {title: title('Landings', 'total'), cls: 'text-end'},
                {title: title('Night T/O / ldg', 'total'), cls: 'text-end'},
                {title: title('Flights', 'total'), cls: 'text-end'},
                {title: title('Hours', 'total'), cls: 'text-end'}
            ], rows, 'No flights yet'), {count: q.types.length})}
        `);
    }

    $(document).ready(function () {
        showLoading();
        airwaysAuth('GET', '/pilot/qualifications', {}, renderQualifications, function (e) {
            if (e && e.status === 401) {
                showPageError('Not signed in: check the token in localStorage (airwaysToken)');
            } else if (e && e.status === 404) {
                showPageError('You have no pilot yet, so there are no qualifications');
            } else {
                showPageError('Failed to load the qualifications');
            }
        });
    });
</script>

</body>
</html>
