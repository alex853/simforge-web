<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Qualifications</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>

    <style>
        .criterion-ok { color: var(--bs-success); font-weight: 700; }
        .criterion-no { color: #fd7e14; font-weight: 700; }
        .vtitle { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: 600; margin: 0 auto; }
        .info { color: var(--bs-secondary-color); cursor: help; font-size: .8em; border: 1px solid currentColor; border-radius: 50%; display: inline-block; width: 1.4em; height: 1.4em; line-height: 1.3em; text-align: center; font-style: italic; }
        .group-start { border-left: 1px solid var(--bs-border-color); }
        th.sub { font-weight: 400; color: var(--bs-secondary); font-size: .85em; }
    </style>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    // GET /pilot/qualifications (token of the user): the totals of the logbook and the currency of the pilot on every type of aircraft of the logbook.
    // Three criteria of a type, each is a green tick (met) or an orange cross (not met); the totals of the type are not used in them. The type
    // currency has two conditions: flights and hours of the last 12 months, the tick is by the hours of the last 12 months.

    // the error of the page without the "Back to map" link of the common showError
    function showPageError(message) {
        $('#page').html(`<div class="alert alert-warning fs-5">${esc(message)}</div>`);
    }

    // the mark of a criterion: a green tick or an orange cross, the tooltip tells what the criterion is
    function mark(ok, tooltip) {
        return ok
            ? '<span class="criterion-ok" title="' + esc(tooltip) + '">&#10003;</span>'
            : '<span class="criterion-no" title="' + esc(tooltip) + '">&#10007;</span>';
    }

    // 0, I, II, III, IV, V
    function roman(level) {
        return ['0', 'I', 'II', 'III', 'IV', 'V'][level] ?? String(level);
    }

    // the tooltip of the experience level: what the next level needs
    function experienceTooltip(a, levels) {
        const next = levels.find(l => l.level === a.experienceLevel + 1);
        return 'Experience level ' + roman(a.experienceLevel) + ' of 0 to V, counted on the total flights and total hours on the type (both needed)'
            + (next ? '. Next, ' + roman(next.level) + ': ' + next.flights + ' flights and ' + next.hours + ' hours.' : '. The highest level.');
    }

    // the small "i" with the explanation
    function info(text) {
        return ' <span class="info" title="' + esc(text) + '">i</span>';
    }

    // a rotated column title (rowspan 2) with the "i"
    function vth(label, hint, cls) {
        return '<th rowspan="2" class="text-center align-bottom ' + (cls ?? '') + '"><div class="vtitle">' + label + '</div>' + info(hint) + '</th>';
    }

    function renderQualifications(q) {
        const t = q.totals;
        const c = q.criteria;
        // the page says 90 days; the real window of the recent landings is in the settings of the server (24 hours for now, for the test)
        const recentLandings = '90 d';
        const recentFlights = q.recentFlightsWindowDays >= 360 ? '12 months' : q.recentFlightsWindowDays + ' d';

        const rows = q.types.map(a => '<tr>'
            + '<td><span class="fw-semibold">' + esc(a.aircraftType) + '</span></td>'
            + '<td class="text-end group-start">' + a.flightTime.toFixed(1) + '</td>'
            + '<td class="text-end">' + fmtNumber(a.flights) + '</td>'
            + '<td class="text-end">' + fmtNumber(a.landings) + '</td>'
            + '<td class="text-center group-start fw-semibold" title="' + esc(experienceTooltip(a, q.experienceLevels)) + '">' + roman(a.experienceLevel) + '</td>'
            + '<td class="text-end group-start">' + fmtNumber(a.recentFlights) + '</td>'
            + '<td class="text-end">' + a.recentFlightTime.toFixed(1) + '</td>'
            + '<td class="text-center">' + mark(a.typeCurrent,
                'Current on type: ' + c.recentFlights + ' or more flights and ' + c.recentFlightHours + ' or more hours in the last ' + recentFlights) + '</td>'
            + '<td class="text-end group-start">' + fmtNumber(a.recentLandings) + '</td>'
            + '<td class="text-center">' + mark(a.canCarryPassengers,
                'Can carry passengers: ' + c.recentLandings + ' or more landings in the last ' + recentLandings) + '</td>'
            + '<td class="text-end group-start">' + a.recentNightTakeoffs + '</td>'
            + '<td class="text-end">' + a.recentNightLandings + '</td>'
            + '<td class="text-center">' + mark(a.nightFlying,
                'Night flying: at least ' + c.nightTakeoffs + ' night takeoff and ' + c.nightLandings + ' night landing in the last ' + recentLandings) + '</td>'
            + '</tr>').join('');

        const table = q.types.length ? `
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th rowspan="2" class="align-bottom">Type</th>
                            <th colspan="3" class="text-center group-start">Total</th>
                            ${vth('Experience level', 'Counted on the total flights and total hours on the type, levels 0 to V', 'group-start')}
                            <th colspan="2" class="text-center group-start">Last ${recentFlights}</th>
                            ${vth('Current on type', 'Counted on the flights and hours of the last ' + recentFlights + ': ' + c.recentFlights + ' flights and ' + c.recentFlightHours + ' hours')}
                            <th rowspan="2" class="text-end align-bottom group-start">Landings<br><span class="text-secondary fw-normal">last ${recentLandings}</span></th>
                            ${vth('Can carry passengers', 'Counted on the landings of the last ' + recentLandings + ': ' + c.recentLandings + ' or more')}
                            <th colspan="2" class="text-center group-start">Night<br><span class="text-secondary fw-normal">last ${recentLandings}</span></th>
                            ${vth('Night flying', 'Counted on the night takeoffs and landings of the last ' + recentLandings + ': ' + c.nightTakeoffs + ' takeoff and ' + c.nightLandings + ' landing')}
                        </tr>
                        <tr>
                            <th class="sub text-end group-start">hours</th><th class="sub text-end">flights</th><th class="sub text-end">landings</th>
                            <th class="sub text-end group-start">flights</th><th class="sub text-end">hours</th>
                            <th class="sub text-end group-start">takeoffs</th><th class="sub text-end">landings</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>` : '<div class="card-body text-secondary">No flights yet</div>';

        $('#page').html(`
            ${entityHeader({kind: 'Pilot', title: 'Qualifications', aside: '<a class="entity-link" href="pilot-logbook.html">Logbook</a>'})}

            ${statTiles([
                {label: 'Flights', value: fmtNumber(t.flights)},
                {label: 'Flight time', value: t.flightTime.toFixed(1), hint: 'hours'},
                {label: 'Night', value: t.nightTime.toFixed(1), hint: 'hours'},
                {label: 'IFR', value: t.ifrTime.toFixed(1), hint: 'hours'},
                {label: 'Takeoffs', value: `${t.dayTakeoffs} / ${t.nightTakeoffs}`, hint: 'day / night'},
                {label: 'Landings', value: `${t.dayLandings} / ${t.nightLandings}`, hint: 'day / night'}
            ])}

            ${section('Aircraft type currency', table, {count: q.types.length})}
        `);
    }

    $(document).ready(function () {
        showLoading();
        airwaysAuth('GET', '/pilot/qualifications', {}, renderQualifications, function (e) {
            if (e && e.status === 401) {
                showPageError('Not signed in: check the token in localStorage (airwaysToken)');
            } else if (e && e.status === 404) {
                showPageError('You have no pilot yet, so there are no qualifications');
            } else {
                showPageError('Failed to load the qualifications');
            }
        });
    });
</script>

</body>
</html>
