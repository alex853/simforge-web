<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Qualifications</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>

    <style>
        .criterion-ok { color: var(--bs-success); font-weight: 700; }
        .criterion-no { color: #fd7e14; font-weight: 700; }
        .group-start { border-left: 1px solid var(--bs-border-color); }
        th.sub { font-weight: 400; color: var(--bs-secondary); font-size: .85em; }
        table.qualifications { table-layout: fixed; }
        table.qualifications td, table.qualifications th { text-align: center; vertical-align: middle; }
        .qual-line { display: flex; justify-content: center; align-items: center; gap: .7rem; white-space: nowrap; }
        .qual-small { font-size: .7em; font-weight: 600; color: var(--bs-success); cursor: help; }
        .qual-penalty { font-size: .75em; font-weight: 600; color: #fd7e14; cursor: help; }
        .qual-help { cursor: help; }
        #sortToggle { text-decoration: none; padding: 0; }
        .qual-label { font-weight: 600; font-size: 1em; }
        .qual-mark { font-size: 1.5em; line-height: 1; }
        .qual-level { font-size: 1.5em; font-weight: 700; line-height: 1; }
        table.qualifications tbody { border-top: 1px solid var(--bs-border-color); }
        /* The numbers and the criteria of a type are close to each other and have more room from the top and the bottom of the block. The four paddings
           are 0.8 + 0.3 + 0.3 + 0.8 = 2.2 rem, as the four of 0.55 rem were (css/details.css), so the block is as high as it was. The selectors are as strong as they have to be
           to win against the padding of the tables in css/details.css. */
        .section table.qualifications > tbody > tr.qual-numbers > td { border-bottom: 0; padding-top: 0.8rem; padding-bottom: 0.3rem; }
        .section table.qualifications > tbody > tr.qual-criteria > td { padding-top: 0.3rem; padding-bottom: 0.8rem; }
    </style>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    // GET /pilot/qualifications (token of the user): the totals of the logbook and the currency of the pilot on every type of aircraft of the logbook.
    // Three criteria of a type, each is a green tick (met) or an orange cross (not met); the totals of the type are not used in them. The type
    // currency has two conditions: flights and hours of the last 12 months, the tick is by the hours of the last 12 months.

    // the error of the page without the "Back to map" link of the common showError
    function showPageError(message) {
        $('#page').html(`<div class="alert alert-warning fs-5">${esc(message)}</div>`);
    }

    // the mark of a criterion: a green tick or an orange cross, the tooltip tells what the criterion is
    function mark(ok, tooltip) {
        return ok
            ? '<span class="criterion-ok" title="' + esc(tooltip) + '">&#10003;</span>'
            : '<span class="criterion-no" title="' + esc(tooltip) + '">&#10007;</span>';
    }

    // 0, I, II, III, IV, V
    function roman(level) {
        return ['0', 'I', 'II', 'III', 'IV', 'V'][level] ?? String(level);
    }

    // the tooltip of the experience level: what the next level needs
    function experienceTooltip(a, levels) {
        const next = levels.find(l => l.level === a.experienceLevel + 1);
        return 'Experience level ' + roman(a.experienceLevel) + ' of 0 to V, counted on the total flights and total hours on the type (both needed)'
            + (next ? '. Next, ' + roman(next.level) + ': ' + next.flights + ' flights and ' + next.hours + ' hours.' : '. The highest level.');
    }

    // 0.5 -> '0.5%', 3 -> '3%'
    function formatPercent(percent) {
        return (Math.round(percent * 1000) / 1000) + '%';
    }

    // One criterion in one line: the title with the tooltip of the criterion, the mark and, if it is not met, what is taken off the pay with its own tooltip.
    // A criterion which is met has no penalty to show.
    function criterion(title, ok, tooltip, penaltyPercent, penaltyTooltip) {
        return '<div class="qual-line"><span class="qual-label qual-help" title="' + esc(tooltip) + '">' + title + '</span>'
            + '<span class="qual-mark">' + mark(ok, '') + '</span>'
            + (ok ? '' : '<span class="qual-penalty" title="' + esc(penaltyTooltip) + '">&minus;' + penaltyPercent + '%</span>')
            + '</div>';
    }

    // The types of the table are sorted in one of three ways, the pilot switches them by the button of the header (the choice is remembered in the browser):
    // recent (the type of the last flight goes first), by the type (alphabetical) and by the total hours (the biggest goes first).
    const SORT_MODES = [
        {key: 'recent', label: 'Recent'},
        {key: 'type', label: 'Type'},
        {key: 'hours', label: 'Total hours'}
    ];

    function savedSortKey() {
        try {
            const key = localStorage.getItem('airwaysQualificationsSort');
            return SORT_MODES.some(m => m.key === key) ? key : 'recent';
        } catch (e) {
            return 'recent';
        }
    }

    let sortKey = savedSortKey();
    let lastResponse = null;

    function sortedTypes(types) {
        const byType = (x, y) => x.aircraftType.localeCompare(y.aircraftType);
        const list = types.slice();
        if (sortKey === 'type') {
            list.sort(byType);
        } else if (sortKey === 'hours') {
            list.sort((x, y) => (y.flightTime - x.flightTime) || byType(x, y));
        } else {
            list.sort((x, y) => (y.lastFlightTime - x.lastFlightTime) || byType(x, y));
        }
        return list;
    }

    function nextSortMode() {
        const i = SORT_MODES.findIndex(m => m.key === sortKey);
        sortKey = SORT_MODES[(i + 1) % SORT_MODES.length].key;
        try {
            localStorage.setItem('airwaysQualificationsSort', sortKey);
        } catch (e) {
            // the choice is just not remembered
        }
        renderQualifications(lastResponse);
    }

    function sortToggle() {
        const mode = SORT_MODES.find(m => m.key === sortKey);
        return '<button type="button" id="sortToggle" class="btn btn-link section-title" title="Sorting of the types: recent (the last flight first), by the type, by the total hours. Click to switch.">'
            + 'Sort: ' + mode.label + '</button>';
    }

    function renderQualifications(q) {
        lastResponse = q;
        const t = q.totals;
        const c = q.criteria;
        // the window of the recent landings in days, it comes from the server (90 days)
        const recentLandings = Math.round(q.recentLandingsWindowHours / 24) + ' d';
        const recentFlights = q.recentFlightsWindowDays >= 360 ? '12 months' : q.recentFlightsWindowDays + ' d';

        // The first line of a type has the numbers, the second line has what the numbers say, in one cell over the numbers they come from: the experience level
        // over the totals, the currency on the type over the flights and hours of the year, the passengers over the landings, the night flying over the night ones.
        const rows = sortedTypes(q.types).map(a => '<tbody>'
            + '<tr class="qual-numbers">'
            + '<td rowspan="2" class="fw-semibold">' + esc(a.aircraftType) + '</td>'
            + '<td class="group-start">' + a.flightTime.toFixed(1) + '</td>'
            + '<td>' + fmtNumber(a.flights) + '</td>'
            + '<td>' + fmtNumber(a.landings) + '</td>'
            + '<td class="group-start">' + fmtNumber(a.recentFlights) + '</td>'
            + '<td>' + a.recentFlightTime.toFixed(1) + '</td>'
            + '<td class="group-start">' + fmtNumber(a.recentLandings) + '</td>'
            + '<td class="group-start">' + a.recentNightTakeoffs + '</td>'
            + '<td>' + a.recentNightLandings + '</td>'
            + '</tr>'
            + '<tr class="qual-criteria">'
            // Each criterion is one cell over the whole group of the numbers it comes from, in one line: the title (its tooltip tells what the criterion is), the value
            // and, for the experience level, the base share of the level; for a criterion which is not met, what is taken off the pay.
            + '<td colspan="3" class="group-start"><div class="qual-line"><span class="qual-label qual-help" title="' + esc(experienceTooltip(a, q.experienceLevels)) + '">Experience level</span>'
            + '<span class="qual-level">' + roman(a.experienceLevel) + '</span>'
            + '<span class="qual-small" title="' + esc('You will get ' + formatPercent(a.baseIncomeSharePercent) + ': your base income share rate is ' + formatPercent(a.baseIncomeSharePercent)
                + ' of the mission payment (the price of the mission)') + '">' + formatPercent(a.baseIncomeSharePercent) + '</span></div></td>'
            + '<td colspan="2" class="group-start">' + criterion('Current on type', a.typeCurrent,
                'Current on type: ' + c.recentFlights + ' or more flights and ' + c.recentFlightHours + ' or more hours on this type in the last ' + recentFlights,
                c.typeCurrencyPenaltyPercent, 'Your base penalty for the missing current on type is ' + c.typeCurrencyPenaltyPercent + '% (of the flight pay and of the income share)') + '</td>'
            + '<td class="group-start">' + criterion('Can carry passengers', a.canCarryPassengers,
                'Can carry passengers: ' + c.recentLandings + ' or more landings on this type in the last ' + recentLandings,
                c.canCarryPassengersPenaltyPercent, 'Your base penalty for not being able to carry passengers is ' + c.canCarryPassengersPenaltyPercent + '% (of the flight pay)') + '</td>'
            + '<td colspan="2" class="group-start">' + criterion('Night flying', a.nightFlying,
                'Night flying: at least ' + c.nightTakeoffs + ' night takeoff and ' + c.nightLandings + ' night landing on this type in the last ' + recentLandings,
                c.nightFlyingPenaltyPercent, 'Your base penalty for the missing night flying is ' + c.nightFlyingPenaltyPercent + '% (of the flight pay)') + '</td>'
            + '</tr>'
            + '</tbody>').join('');

        // the widths are fixed, so the centers of the columns are the same in the numbers and in the criteria; the landings of 90 days get the room which
        // the night columns do not need
        const table = q.types.length ? `
            <div class="table-responsive">
                <table class="table qualifications mb-0">
                    <colgroup>
                        <col style="width: 8%">
                        <col style="width: 9%"><col style="width: 9%"><col style="width: 9%">
                        <col style="width: 12%"><col style="width: 12%">
                        <col style="width: 21%">
                        <col style="width: 10%"><col style="width: 10%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th rowspan="2" class="align-bottom">Type</th>
                            <th colspan="3" class="group-start">Total</th>
                            <th colspan="2" class="group-start">Last ${recentFlights}</th>
                            <th rowspan="2" class="align-bottom group-start">Landings<br><span class="text-secondary fw-normal">last ${recentLandings}</span></th>
                            <th colspan="2" class="group-start">Night<br><span class="text-secondary fw-normal">last ${recentLandings}</span></th>
                        </tr>
                        <tr>
                            <th class="sub group-start">hours</th><th class="sub">flights</th><th class="sub">landings</th>
                            <th class="sub group-start">flights</th><th class="sub">hours</th>
                            <th class="sub group-start">takeoffs</th><th class="sub">landings</th>
                        </tr>
                    </thead>
                    ${rows}
                </table>
            </div>` : '<div class="card-body text-secondary">No flights yet</div>';

        $('#page').html(`
            ${entityHeader({kind: 'Pilot', title: 'Qualifications', aside: '<a class="entity-link me-3" href="pilot.html">Pilot</a><a class="entity-link" href="pilot-logbook.html">Logbook</a>'})}

            ${statTiles([
                {label: 'Flights', value: fmtNumber(t.flights)},
                {label: 'Flight time', value: t.flightTime.toFixed(1), hint: 'hours'},
                {label: 'Night', value: t.nightTime.toFixed(1), hint: 'hours'},
                {label: 'IFR', value: t.ifrTime.toFixed(1), hint: 'hours'},
                {label: 'Takeoffs', value: `${t.dayTakeoffs} / ${t.nightTakeoffs}`, hint: 'day / night'},
                {label: 'Landings', value: `${t.dayLandings} / ${t.nightLandings}`, hint: 'day / night'}
            ])}

            ${section('Aircraft type currency', table, {count: q.types.length, tools: q.types.length > 1 ? sortToggle() : ''})}
        `);
        $('#sortToggle').on('click', nextSortMode);
    }

    $(document).ready(function () {
        showLoading();
        airwaysAuth('GET', '/pilot/qualifications', {}, renderQualifications, function (e) {
            if (e && e.status === 401) {
                showPageError('Not signed in: check the token in localStorage (airwaysToken)');
            } else if (e && e.status === 404) {
                showPageError('You have no pilot yet, so there are no qualifications');
            } else {
                showPageError('Failed to load the qualifications');
            }
        });
    });
</script>

</body>
</html>
