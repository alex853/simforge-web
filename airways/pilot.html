<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Pilot</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>
    <script src="js/pilot-tiles.js"></script>

    <style>
        /* the pencil in the bottom right corner of the picture of the pilot opens the choice of the avatar; the picture itself is not a button */
        .pilot-avatar { position: relative; }
        .avatar-edit { position: absolute; right: -9px; bottom: -9px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0;
            color: var(--bs-secondary-color); background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 50%; cursor: pointer; }
        .avatar-edit:hover { color: var(--bs-primary); border-color: var(--bs-primary); }
        .avatar-edit svg, .initials-edit svg { width: 14px; height: 14px; }
        /* the pencil next to the initials opens the dialog of the initials */
        .initials-edit { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-left: .6rem; padding: 0; vertical-align: middle;
            color: var(--bs-secondary-color); background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 50%; cursor: pointer; }
        .initials-edit:hover { color: var(--bs-primary); border-color: var(--bs-primary); }
        /* the pilot has no initials: two quiet underscores */
        .initials-empty { color: var(--bs-secondary-color); opacity: .6; }
        .initials-input { max-width: 8rem; font-size: 1.4rem; font-weight: 600; letter-spacing: .1em; }
        /* the modal of the avatars: about three fifths of the height of the screen, the pictures as tiles which scroll inside it */
        #avatarModal .modal-dialog { height: min(60vh, 640px); min-height: 320px; }
        .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .6rem; }
        .picker-tile { display: flex; align-items: center; justify-content: center; height: 84px; padding: 0; background: var(--bs-tertiary-bg);
            border: 2px solid transparent; border-radius: .6rem; cursor: pointer; }
        .picker-tile:hover { border-color: var(--bs-border-color); }
        .picker-tile.selected { border-color: var(--bs-primary); background: var(--bs-primary-bg-subtle); }
        .picker-tile img { width: 64px; height: 64px; image-rendering: pixelated; }
        /* the two big buttons of the third row: as wide as a tile and as high as they are wide */
        .fly-button { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 1 / 1; padding: 1rem; font-size: 1.7rem; font-weight: 700;
            line-height: 1.2; text-align: center; white-space: normal; border-radius: .75rem; }
    </style>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<!-- the pencil next to the initials opens this modal: one text field, up to two English letters or digits, it can be empty (the server checks it again) -->
<div class="modal fade" id="initialsModal" tabindex="-1" aria-labelledby="initialsModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="--bs-modal-width: 420px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="initialsModalTitle">Your initials</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label for="initialsInput" class="form-label">Type your initials</label>
                <input type="text" id="initialsInput" class="form-control initials-input" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false">
                <div class="form-text">Up to 2 characters: English letters and digits. It can be empty.</div>
                <div class="text-danger small mt-1" id="initialsError"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal" id="initialsCancel">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" id="initialsSave">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- the pencil on the picture of the pilot opens this modal: all the pictures which may be chosen (the list comes from the server when it is shown) -->
<div class="modal fade" id="avatarModal" tabindex="-1" aria-labelledby="avatarModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="avatarModalTitle">Choose your avatar</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="pickerBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal" id="pickerCancel">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" id="pickerSave" disabled>Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Travel: where to, then the ways to get there (the server offers them with the time and the money, see GET /pilot/travel/options) -->
<div class="modal fade" id="travelModal" tabindex="-1" aria-labelledby="travelModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="travelModalTitle">Travel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label for="travelAirport" class="form-label">Where to? Type the code of the airport</label>
                <div class="input-group">
                    <input type="text" id="travelAirport" class="form-control initials-input" style="max-width: none; letter-spacing: .1em;" maxlength="4"
                           placeholder="ICAO, e.g. EGLL" autocomplete="off" autocapitalize="characters" spellcheck="false">
                    <button type="button" class="btn btn-outline-secondary" id="travelShow">Show ways</button>
                </div>
                <div class="text-danger small mt-2" id="travelError"></div>
                <div id="travelOptions" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<!-- Wake up asks first: a sleep under two hours gives nothing, a longer one makes the awake time grow -->
<div class="modal fade" id="wakeModal" tabindex="-1" aria-labelledby="wakeModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="--bs-modal-width: 440px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="wakeModalTitle">Wake up?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="wakeModalText"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Keep sleeping</button>
                <button type="button" class="btn btn-sm btn-primary" id="wakeConfirm">Wake up</button>
            </div>
        </div>
    </div>
</div>

<script>
    // GET /pilot (token of the user): who the pilot is, the state, where the pilot is and the balance of the bank account. Facts only.

    // the error of the page without the "Back to map" link of the common showError
    function showPageError(message) {
        $('#page').html(`<div class="alert alert-warning fs-5">${esc(message)}</div>`);
    }

    function bankTile(p) {
        if (p.bankBalance === null || p.bankBalance === undefined) {
            return {label: 'Bank account', html: '<span class="location-away">No account yet</span>'};
        }
        return {
            label: 'Bank account',
            value: `<span class="money${p.bankBalance < 0 ? ' money-negative' : ''}">${moneyHtml(p.bankBalance)}</span>`,
            hint: 'Balance'
        };
    }


    // The flight time (blocks off to blocks on, with the flight in progress) in the last 30 days: not more than 80 hours, orange from 70.
    function flightTime30Tile(p) {
        const f = p.flightTime;
        if (!f) {
            return {label: 'Flight time, 30 days', html: '<span class="location-away">Unknown</span>'};
        }
        return limitTile('Flight time, 30 days', f.last30DaysMinutes, f.limit30DaysMinutes, f.limit30DaysMinutes - 10 * 60, formatHours,
            'Last 30 days, max ' + (f.limit30DaysMinutes / 60) + ' h',
            {near: 'Close to the limit', over: 'Limit exceeded'});
    }

    // The same for the last 365 days: not more than 800 hours, orange from 700.
    function flightTime365Tile(p) {
        const f = p.flightTime;
        if (!f) {
            return {label: 'Flight time, 365 days', html: '<span class="location-away">Unknown</span>'};
        }
        return limitTile('Flight time, 365 days', f.last365DaysMinutes, f.limit365DaysMinutes, f.limit365DaysMinutes - 100 * 60, formatHours,
            'Last 365 days, max ' + (f.limit365DaysMinutes / 60) + ' h',
            {near: 'Close to the limit', over: 'Limit exceeded'});
    }

    // The third row: two big square buttons in the middle (the second and the third place of the row of four), a little lower than the tiles. ShadowJet is not
    // open yet, so its button is disabled; busyBirds is the booking of the missions.
    function flyButtons() {
        return `
        <div class="row g-3 mt-4 justify-content-center">
            <div class="col-6 col-md-3">
                <button type="button" class="btn btn-outline-secondary fly-button" id="flyShadowJet" disabled>Fly ShadowJet</button>
            </div>
            <div class="col-6 col-md-3">
                <a class="btn btn-primary fly-button" id="flyBusyBirds" href="busy-birds.html">Fly busyBirds</a>
            </div>
        </div>`;
    }

    // the place of a tile which is not decided yet
    function placeholderTile() {
        return {label: 'Coming soon', html: '<span class="location-away">&nbsp;</span>', placeholder: true};
    }

    const PENCIL_SVG = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>';

    // ---- the initials: the title of the page is the initials of the pilot, a pencil next to them opens the modal with one text field. Up to two characters, only
    // English letters (upper and lower case) and digits, 62 characters; it can be empty, then two quiet underscores are shown. The server checks it again.
    // the initials the page shows now: the modal starts with them
    let currentInitials = '';
    let initialsModal = null;
    let avatarModal = null;
    const INITIALS_ERROR = 'Only English letters and digits, two characters at most';

    // the title of the page: the initials (or two underscores) and the pencil
    function initialsTitleHtml(initials) {
        const text = initials ? esc(initials) : '<span class="initials-empty" title="No initials yet">__</span>';
        return text + '<button type="button" class="initials-edit" title="Change the initials" aria-label="Change the initials">' + PENCIL_SVG + '</button>';
    }

    function initInitialsModal() {
        const $modal = $('#initialsModal');
        const $input = $('#initialsInput');
        initialsModal = new bootstrap.Modal($modal[0]);
        // the modal starts with the initials of the page, without an error; the field is ready to type
        $modal.on('show.bs.modal', function () {
            $input.val(currentInitials);
            $('#initialsError').text('');
            $('#initialsSave, #initialsCancel').prop('disabled', false);
        });
        $modal.on('shown.bs.modal', function () {
            $input.trigger('focus').trigger('select');
        });
        // only English letters and digits are let in, two at most; a character which does not fit just does not appear, and the field says why
        $input.on('input', function () {
            const cleaned = $input.val().replace(/[^A-Za-z0-9]/g, '').slice(0, 2);
            $('#initialsError').text(cleaned !== $input.val() ? INITIALS_ERROR : '');
            $input.val(cleaned);
        });
        const save = function () {
            const value = $input.val();
            if (!/^[A-Za-z0-9]{0,2}$/.test(value)) {
                $('#initialsError').text(INITIALS_ERROR);
                return;
            }
            $('#initialsSave, #initialsCancel').prop('disabled', true);
            airwaysAuth('POST', '/pilot/initials', {initials: value}, function (pilot) {
                initialsModal.hide();
                renderPilot(pilot);
            }, function (e) {
                $('#initialsError').text(e && e.status === 400 ? INITIALS_ERROR : 'The initials were not saved, try again');
                $('#initialsSave, #initialsCancel').prop('disabled', false);
            });
        };
        $('#initialsSave').on('click', save);
        $input.on('keydown', function (e) {
            if (e.key === 'Enter') {
                save();
            }
        });
    }

    // ---- the choice of the avatar: the pencil on the picture of the pilot opens the modal with all the pictures which may be chosen, the shown one is chosen
    // already. The list comes from the server (GET /pilot/avatars) when the modal is shown; Save sends the chosen file name (POST /pilot/avatar).
    function initAvatarModal() {
        const $modal = $('#avatarModal');
        const $body = $('#pickerBody');
        avatarModal = new bootstrap.Modal($modal[0]);
        let chosen = null;
        $modal.on('show.bs.modal', function () {
            chosen = null;
            $body.html('<div class="text-secondary">Loading...</div>');
            $('#pickerSave, #pickerCancel').prop('disabled', true);
            $('#pickerCancel').prop('disabled', false);
        });
        // the layout of the modal is final when it is shown: the list is loaded then and the chosen picture is scrolled to the middle
        $modal.on('shown.bs.modal', function () {
            airwaysAuth('GET', '/pilot/avatars', {}, function (r) {
                chosen = r.current;
                $body.html('<div class="picker-grid">' + r.images.map(image =>
                    '<button type="button" class="picker-tile' + (image === chosen ? ' selected' : '') + '" data-image="' + esc(image) + '" title="'
                    + esc(image.replace(/\.png$/, '').replace(/_/g, ' ')) + '">' + avatarHtml(image) + '</button>').join('') + '</div>');
                const selected = $body.find('.picker-tile.selected')[0];
                if (selected) {
                    $body[0].scrollTop += selected.getBoundingClientRect().top - $body[0].getBoundingClientRect().top - ($body[0].clientHeight - selected.offsetHeight) / 2;
                }
                $('#pickerSave').prop('disabled', false);
            }, function () {
                $body.html('<div class="text-danger">The pictures could not be loaded</div>');
            });
        });
        $body.on('click', '.picker-tile', function () {
            chosen = $(this).data('image');
            $body.find('.picker-tile').removeClass('selected');
            $(this).addClass('selected');
        });
        $('#pickerSave').on('click', function () {
            $('#pickerSave, #pickerCancel').prop('disabled', true);
            airwaysAuth('POST', '/pilot/avatar', {image: chosen}, function (pilot) {
                avatarModal.hide();
                renderPilot(pilot);
            }, function () {
                alert('The avatar was not saved, try again');
                $('#pickerSave, #pickerCancel').prop('disabled', false);
            });
        });
    }

    function renderPilot(p) {
        currentInitials = p.initials || '';
        $('#page').html(`
            ${pilotHeader({title: initialsTitleHtml(p.initials), avatarImage: p.avatarImage})}

            ${tiles([stateTile(p), locationTile(p, true), placeholderTile(), bankTile(p)])}
            ${tiles([awakeTile(p, true), dutyTile(p), flightTime30Tile(p), flightTime365Tile(p)])}

            ${flyButtons()}
        `);
        $('.pilot-avatar').append('<button type="button" class="avatar-edit" title="Change the avatar" aria-label="Change the avatar">' + PENCIL_SVG + '</button>');
        $('.avatar-edit').on('click', () => avatarModal.show());
        $('.initials-edit').on('click', () => initialsModal.show());
        $('#travelButton').on('click', () => travelModal.show());
        $('#sleepButton').on('click', () => sleepOrWake('/pilot/sleep'));
        $('#wakeButton').on('click', () => askToWakeUp(p));
    }

    // ---- Travel: the pilot types the airport, the server offers the ways with the time and the money, a click on Go pays and sends the pilot.
    let travelModal = null;

    // minutes as a plain duration: 18 min, 4 h 40 min, 3 d 5 h; zero is 'At once'
    function formatDuration(minutes) {
        if (minutes <= 0) {
            return 'At once';
        }
        if (minutes < 60) {
            return minutes + ' min';
        }
        if (minutes < 48 * 60) {
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return h + ' h' + (m ? ' ' + m + ' min' : '');
        }
        const d = Math.floor(minutes / (24 * 60));
        const h = Math.round((minutes % (24 * 60)) / 60);
        return d + ' d' + (h ? ' ' + h + ' h' : '');
    }

    function travelErrorText(e, fallback) {
        return e && e.responseJSON && e.responseJSON.message ? e.responseJSON.message : fallback;
    }

    function showTravelOptions(r) {
        const rows = r.options.map(o => `
            <div class="d-flex align-items-center gap-3 py-2 border-top" title="${esc(o.problem ?? '')}">
                <div class="flex-grow-1">
                    <div class="fw-semibold${o.available ? '' : ' text-secondary'}">${esc(o.title)}</div>
                    <div class="small text-secondary">${formatDuration(o.durationMinutes)}${o.problem ? ' &middot; ' + esc(o.problem) : ''}</div>
                </div>
                <div class="text-end money">${o.price > 0 ? moneyHtml(o.price) : 'Free'}</div>
                <button type="button" class="btn btn-sm btn-outline-secondary travel-go" data-method="${esc(o.method)}"${o.available ? '' : ' disabled'}>Go</button>
            </div>`).join('');
        $('#travelOptions').html(`
            <div class="mb-2"><span class="fw-semibold">${esc(r.airportIcao)}</span> <span class="text-secondary">${esc(r.airportName ?? '')}, ${r.distanceNm.toLocaleString()} nm</span></div>
            ${rows}`);
    }

    function loadTravelOptions() {
        const icao = $('#travelAirport').val().trim().toUpperCase();
        $('#travelError').text('');
        $('#travelOptions').empty();
        if (!icao) {
            return;
        }
        airwaysAuth('GET', '/pilot/travel/options', {airport: icao}, showTravelOptions, function (e) {
            $('#travelError').text(e && e.status === 404 ? 'There is no such airport' : travelErrorText(e, 'The ways could not be loaded, try again'));
        });
    }

    function initTravelModal() {
        const $modal = $('#travelModal');
        travelModal = new bootstrap.Modal($modal[0]);
        $modal.on('show.bs.modal', function () {
            $('#travelAirport').val('');
            $('#travelError').text('');
            $('#travelOptions').empty();
        });
        $modal.on('shown.bs.modal', () => $('#travelAirport').trigger('focus'));
        $('#travelAirport').on('input', function () {
            $(this).val($(this).val().toUpperCase().replace(/[^A-Z0-9]/g, ''));
        }).on('keydown', function (e) {
            if (e.key === 'Enter') {
                loadTravelOptions();
            }
        });
        $('#travelShow').on('click', loadTravelOptions);
        // Go pays and sends the pilot at once: the buttons are locked while the request is in flight
        $('#travelOptions').on('click', '.travel-go', function () {
            const method = $(this).data('method');
            $('#travelOptions .travel-go, #travelShow').prop('disabled', true);
            actionInProgress = true;
            airwaysAuth('POST', '/pilot/travel', {airport: $('#travelAirport').val().trim().toUpperCase(), method: method}, function (pilot) {
                actionInProgress = false;
                travelModal.hide();
                renderPilot(pilot);
            }, function (e) {
                actionInProgress = false;
                $('#travelShow').prop('disabled', false);
                $('#travelError').text(travelErrorText(e, 'The travel failed, try again'));
                loadTravelOptions();
            });
        });
    }

    // The question before waking up: under two hours of sleep gives nothing, a longer sleep makes the awake time grow by about so many hours
    // (the gain is rounded to whole hours, at least one).
    let wakeModal = null;

    function askToWakeUp(p) {
        const a = p.awake;
        let text;
        if (a.sleepMinutes < 120) {
            text = 'You have slept less than 2 hours, waking up now will not add anything to your awake time.';
        } else {
            const hours = Math.max(1, Math.round((a.creditAfterWakeMinutes - a.creditMinutes) / 60));
            text = 'Your awake time will grow by about ' + hours + (hours === 1 ? ' hour.' : ' hours.');
            // the credit after a long sleep is cut at a random value up to the maximum: say it, so a sleep above the need is not a surprise
            if (a.creditAfterWakeMaxMinutes > a.creditAfterWakeMinutes) {
                text += ' It tops out at about 21-22 hours, so any sleep beyond that is wasted.';
            }
        }
        $('#wakeModalText').text(text);
        wakeModal.show();
    }

    // a sleep or wake request is in flight: the refresh waits, so it does not draw an old state over the new one
    let actionInProgress = false;

    // POST /pilot/sleep or /pilot/wake: the answer is the pilot as GET /pilot gives it, the page is drawn again
    function sleepOrWake(url) {
        actionInProgress = true;
        $('#sleepButton, #wakeButton').prop('disabled', true);
        airwaysAuth('POST', url, {}, function (pilot) {
            actionInProgress = false;
            renderPilot(pilot);
        }, function (e) {
            actionInProgress = false;
            alert(e && e.status === 409 ? (e.responseJSON && e.responseJSON.message ? e.responseJSON.message : 'The pilot cannot do it now') : 'Failed, try again');
            loadPilot();
        });
    }

    // The page reads the pilot again once a minute (the awake time falls, the duty and the flight time change while a flight goes). A failed refresh
    // is not shown: the page keeps what it has until the next one.
    const REFRESH_INTERVAL_MS = 60 * 1000;

    function refreshPilot() {
        if (actionInProgress) {
            return;
        }
        airwaysAuth('GET', '/pilot', {}, function (pilot) {
            if (!actionInProgress) {
                renderPilot(pilot);
            }
        }, function () {
            // keep the current content
        });
    }

    function loadPilot() {
        airwaysAuth('GET', '/pilot', {}, renderPilot, function (e) {
            if (e && e.status === 401) {
                showPageError('Not signed in: check the token in localStorage (airwaysToken)');
            } else if (e && e.status === 404) {
                showPageError('You have no pilot yet');
            } else {
                showPageError('Failed to load the pilot');
            }
        });
    }

    $(document).ready(function () {
        initSiteMenu('pilot');
        initInitialsModal();
        initAvatarModal();
        initTravelModal();
        wakeModal = new bootstrap.Modal(document.getElementById('wakeModal'));
        $('#wakeConfirm').on('click', function () {
            wakeModal.hide();
            sleepOrWake('/pilot/wake');
        });
        showLoading();
        loadPilot();
        setInterval(refreshPilot, REFRESH_INTERVAL_MS);
    });
</script>

</body>
</html>
