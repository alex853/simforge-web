<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>airways / Pilot</title>

    <script>
        document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/details.css" rel="stylesheet">

    <script src="js/requests.js"></script>
    <script src="../js/flags.js"></script>
    <script src="js/details.js"></script>

    <style>
        /* where the pilot is: the airport or the city is big and green, "piloting an aircraft" is not a place, so it is thin and quiet */
        .location-place { color: var(--bs-success); }
        .location-away { font-size: 1.3rem; font-weight: 400; line-height: 1.6; color: var(--bs-secondary-color); white-space: normal; }
        .money { font-variant-numeric: tabular-nums; }
        /* the number is green while there is room, orange when it is close to the limit, red over it; the note stands right of the number */
        .duty-ok { color: var(--bs-success); }
        .duty-near { color: #fd7e14; }
        .duty-over { color: var(--bs-danger); }
        .duty-line { display: flex; align-items: center; gap: .7rem; }
        .duty-note { font-size: .8rem; font-weight: 600; line-height: 1.15; white-space: normal; }
        /* the pencil in the bottom right corner of the picture of the pilot opens the choice of the avatar; the picture itself is not a button */
        .pilot-avatar { position: relative; }
        .avatar-edit { position: absolute; right: -9px; bottom: -9px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0;
            color: var(--bs-secondary-color); background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 50%; cursor: pointer; }
        .avatar-edit:hover { color: var(--bs-primary); border-color: var(--bs-primary); }
        .avatar-edit svg, .initials-edit svg { width: 14px; height: 14px; }
        /* the pencil next to the initials opens the dialog of the initials */
        .initials-edit { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-left: .6rem; padding: 0; vertical-align: middle;
            color: var(--bs-secondary-color); background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 50%; cursor: pointer; }
        .initials-edit:hover { color: var(--bs-primary); border-color: var(--bs-primary); }
        /* the pilot has no initials: two quiet underscores */
        .initials-empty { color: var(--bs-secondary-color); opacity: .6; }
        .picker-panel.picker-panel-small { height: auto; min-height: 0; width: min(420px, 94vw); }
        .initials-input { max-width: 8rem; font-size: 1.4rem; font-weight: 600; letter-spacing: .1em; }

        /* the choice of the avatar: a panel over the page, the pictures as tiles which scroll */
        .picker-backdrop { position: fixed; inset: 0; z-index: 1050; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .45); }
        .picker-panel { display: flex; flex-direction: column; width: min(760px, 94vw); height: min(60vh, 640px); min-height: 320px; background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color); border-radius: .75rem; box-shadow: 0 .5rem 2rem rgba(0, 0, 0, .3); overflow: hidden; }
        .picker-header, .picker-footer { display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; }
        .picker-header { border-bottom: 1px solid var(--bs-border-color); }
        .picker-footer { border-top: 1px solid var(--bs-border-color); justify-content: flex-end; }
        .picker-title { flex-grow: 1; font-weight: 600; }
        .picker-body { flex: 1; overflow-y: auto; padding: 1rem; }
        .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .6rem; }
        .picker-tile { display: flex; align-items: center; justify-content: center; height: 84px; padding: 0; background: var(--bs-tertiary-bg);
            border: 2px solid transparent; border-radius: .6rem; cursor: pointer; }
        .picker-tile:hover { border-color: var(--bs-border-color); }
        .picker-tile.selected { border-color: var(--bs-primary); background: var(--bs-primary-bg-subtle); }
        .picker-tile img { width: 64px; height: 64px; image-rendering: pixelated; }
        /* a place kept for a tile which is not decided yet */
        .stat.stat-placeholder { border-style: dashed; background: transparent; }
        /* the buttons of a tile sit in its top right corner, in the free place of the label row, so they do not make the tile higher */
        .stat.has-corner { position: relative; }
        .stat-corner { position: absolute; top: .45rem; right: .6rem; }
        .stat-corner .btn { --bs-btn-padding-y: .05rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .8rem; line-height: 1.3; }
        .money-negative { color: var(--bs-danger); }
    </style>
</head>
<body>

<nav class="navbar bg-body border-bottom">
    <div class="container-lg">
        <a class="navbar-brand" href="index.html">simforge / airways</a>
    </div>
</nav>

<main class="container-lg py-4" id="page"></main>

<script>
    // GET /pilot (token of the user): who the pilot is, the state, where the pilot is and the balance of the bank account. Facts only.

    // the error of the page without the "Back to map" link of the common showError
    function showPageError(message) {
        $('#page').html(`<div class="alert alert-warning fs-5">${esc(message)}</div>`);
    }

    // the state of the person with a plain explanation of what it means for the player
    const STATES = {
        Idle: {title: 'Idle', hint: 'You are free'},
        OnDuty: {title: 'On duty', hint: 'You are on a flight'},
        Travelling: {title: 'Travelling', hint: 'You are on the way'},
        Resting: {title: 'Resting', hint: 'You are resting'}
    };

    function stateTile(p) {
        const s = STATES[p.state] ?? {title: p.state, hint: ''};
        return {label: 'State', value: esc(s.title), hint: esc(s.hint)};
    }

    // At an airport or in a city the place is a big green title. When the pilot is nowhere (in the flight, on the way) it is a thin quiet line.
    function locationTile(p) {
        if (p.locationType === 'Airport' && p.airportIcao) {
            return {
                label: 'Location',
                value: `<a class="entity-link location-place" href="${airportUrl(p.airportIcao)}">${esc(p.airportIcao)}</a>`,
                hint: esc(p.airportName ?? '')
            };
        }
        if (p.locationType === 'City' && p.cityName) {
            return {label: 'Location', value: `<span class="location-place">${esc(p.cityName)}</span>`, hint: 'In the city'};
        }
        if (p.locationType === 'Hotel') {
            return {label: 'Location', html: '<span class="location-away">In a hotel</span>'};
        }
        const away = p.state === 'OnDuty' ? 'Piloting an aircraft' : 'On the way';
        return {label: 'Location', html: `<span class="location-away">${away}</span>`};
    }

    function bankTile(p) {
        if (p.bankBalance === null || p.bankBalance === undefined) {
            return {label: 'Bank account', html: '<span class="location-away">No account yet</span>'};
        }
        return {
            label: 'Bank account',
            value: `<span class="money${p.bankBalance < 0 ? ' money-negative' : ''}">${fmtNumber(p.bankBalance)}</span>`,
            hint: 'Balance'
        };
    }

    // minutes as a clock with the sign: 750 -> '12:30', -80 -> '\u22121:20'
    function formatClock(minutes) {
        const abs = Math.abs(minutes);
        return (minutes < 0 ? '\u2212' : '') + Math.floor(abs / 60) + ':' + String(abs % 60).padStart(2, '0');
    }

    // the awake time is orange when it is less than this
    const AWAKE_NEAR_MINUTES = 4 * 60;

    // The time the pilot can still stay awake and active (the awake credit of the server). Sleeping fills it: two hours of the credit for an hour of sleep,
    // but a sleep shorter than two hours gives nothing, the most is 16 hours. Below zero the pilot is overtired. The buttons of the tile put the pilot
    // to sleep and wake the pilot up; only a free pilot can go to sleep.
    function awakeTile(p) {
        const a = p.awake;
        if (!a) {
            return {label: 'Awake time', html: '<span class="location-away">Unknown</span>'};
        }
        let value, hint, button;
        if (a.sleeping) {
            value = '<span>Sleeping ' + formatClock(a.sleepMinutes) + '</span>';
            hint = a.sleepMinutes >= 120
                ? 'If you wake up now: ' + formatClock(a.creditAfterWakeMinutes)
                : 'Less than 2 h of sleep gives no awake time';
            button = '<button type="button" class="btn btn-sm btn-outline-secondary" id="wakeButton">Wake up</button>';
        } else {
            // green: four hours or more; orange: less than four hours; red: below zero, the pilot is overtired
            const cls = a.creditMinutes < 0 ? 'duty-over' : (a.creditMinutes < AWAKE_NEAR_MINUTES ? 'duty-near' : 'duty-ok');
            value = '<span class="money ' + cls + '">' + formatClock(a.creditMinutes) + '</span>';
            hint = a.creditMinutes < 0 ? 'You are overtired, you need sleep'
                : (a.creditMinutes < AWAKE_NEAR_MINUTES ? 'Less than ' + formatClock(AWAKE_NEAR_MINUTES) + ' left, plan your sleep' : 'Hours left before you need sleep');
            const canSleep = p.state === 'Idle';
            button = '<button type="button" class="btn btn-sm btn-outline-secondary" id="sleepButton"' + (canSleep ? '' : ' disabled title="Only a free pilot can go to sleep"') + '>Sleep</button>';
        }
        return {label: 'Awake time', value: value, hint: esc(hint), actions: button};
    }

    // A tile with a number which has a limit: green while there is room, orange when it is close to the limit, red over it, and the note of the
    // orange and the red states stands right of the number. Nothing is enforced yet, the page only shows the number and the limit.
    // nearMinutes: from how many minutes the number is orange; text: {unknown, near, over} the notes.
    function limitTile(label, minutes, limitMinutes, nearMinutes, formatValue, hint, notes) {
        let cls = 'duty-ok';
        let note = '';
        if (minutes > limitMinutes) {
            cls = 'duty-over';
            note = notes.over;
        } else if (minutes >= nearMinutes) {
            cls = 'duty-near';
            note = notes.near;
        }
        const value = '<span class="duty-line"><span class="money ' + cls + '">' + formatValue(minutes) + '</span>'
            + (note ? '<span class="duty-note ' + cls + '">' + note + '</span>' : '') + '</span>';
        return {label: label, value: value, hint: esc(hint)};
    }

    // hours with one digit: 3804 minutes -> '63.4'
    function formatHours(minutes) {
        return (Math.round(minutes / 6) / 10).toFixed(1);
    }

    // The duty in the last 24 hours (the sliding window, not the calendar day): the finished flights of the logbook and the flight in progress up to now,
    // each from Start flight to Finish flight. It must not exceed 14 hours; orange from 12 hours.
    function dutyTile(p) {
        const d = p.duty;
        if (!d) {
            return {label: 'Duty time', html: '<span class="location-away">Unknown</span>'};
        }
        const hint = d.onDuty ? 'Last 24 h with this flight, max ' + formatClock(d.limitMinutes) : 'Last 24 h, not more than ' + formatClock(d.limitMinutes);
        return limitTile('Duty time', d.last24HoursMinutes, d.limitMinutes, d.limitMinutes - 120, formatClock, hint,
            {near: 'Close to the duty time limit', over: 'Duty time limit exceeded'});
    }

    // The flight time (blocks off to blocks on, with the flight in progress) in the last 30 days: not more than 80 hours, orange from 70.
    function flightTime30Tile(p) {
        const f = p.flightTime;
        if (!f) {
            return {label: 'Flight time, 30 days', html: '<span class="location-away">Unknown</span>'};
        }
        return limitTile('Flight time, 30 days', f.last30DaysMinutes, f.limit30DaysMinutes, f.limit30DaysMinutes - 10 * 60, formatHours,
            'Last 30 days, max ' + (f.limit30DaysMinutes / 60) + ' h',
            {near: 'Close to the limit', over: 'Limit exceeded'});
    }

    // The same for the last 365 days: not more than 800 hours, orange from 700.
    function flightTime365Tile(p) {
        const f = p.flightTime;
        if (!f) {
            return {label: 'Flight time, 365 days', html: '<span class="location-away">Unknown</span>'};
        }
        return limitTile('Flight time, 365 days', f.last365DaysMinutes, f.limit365DaysMinutes, f.limit365DaysMinutes - 100 * 60, formatHours,
            'Last 365 days, max ' + (f.limit365DaysMinutes / 60) + ' h',
            {near: 'Close to the limit', over: 'Limit exceeded'});
    }

    // the place of a tile which is not decided yet
    function placeholderTile() {
        return {label: 'Coming soon', html: '<span class="location-away">&nbsp;</span>', placeholder: true};
    }

    // tiles of the same width, four in a row
    function tiles(list) {
        return `
        <div class="row g-3 mb-4">
            ${list.map(t => `
            <div class="col-6 col-md-3">
                <div class="stat${t.actions ? ' has-corner' : ''}${t.placeholder ? ' stat-placeholder' : ''}">
                    ${t.actions ? `<div class="stat-corner">${t.actions}</div>` : ''}
                    <div class="stat-label">${esc(t.label)}</div>
                    ${t.html !== undefined ? `<div class="stat-small">${t.html}</div>` : `<div class="stat-value">${t.value}</div>`}
                    ${t.hint ? `<div class="stat-hint">${t.hint}</div>` : ''}
                </div>
            </div>`).join('')}
        </div>`;
    }

    const PENCIL_SVG = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>';

    // ---- the initials: the title of the page is the initials of the pilot, a pencil next to them opens a dialog with one text field. Up to two characters, only
    // English letters (upper and lower case) and digits, 62 characters; it can be empty, then two quiet underscores are shown. The server checks it again.
    let initialsDialog = null;
    // the initials the page shows now: the dialog starts with them
    let currentInitials = '';

    // the title of the page: the initials (or two underscores) and the pencil
    function initialsTitleHtml(initials) {
        const text = initials ? esc(initials) : '<span class="initials-empty" title="No initials yet">__</span>';
        return text + '<button type="button" class="initials-edit" title="Change the initials" aria-label="Change the initials">' + PENCIL_SVG + '</button>';
    }

    function closeInitialsDialog() {
        if (initialsDialog) {
            initialsDialog.remove();
            initialsDialog = null;
            $(document).off('keydown.initialsDialog');
        }
    }

    function openInitialsDialog() {
        if (initialsDialog || avatarPicker) {
            return;
        }
        const current = currentInitials;
        initialsDialog = $(`
            <div class="picker-backdrop">
                <div class="picker-panel picker-panel-small" role="dialog" aria-label="Your initials">
                    <div class="picker-header"><span class="picker-title">Your initials</span><button type="button" class="btn-close" id="initialsClose" aria-label="Close"></button></div>
                    <div class="picker-body">
                        <label for="initialsInput" class="form-label">Type your initials</label>
                        <input type="text" id="initialsInput" class="form-control initials-input" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false">
                        <div class="form-text">Up to 2 characters: English letters and digits. It can be empty.</div>
                        <div class="text-danger small mt-1" id="initialsError"></div>
                    </div>
                    <div class="picker-footer">
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="initialsCancel">Cancel</button>
                        <button type="button" class="btn btn-sm btn-primary" id="initialsSave">Save</button>
                    </div>
                </div>
            </div>`);
        $('body').append(initialsDialog);
        const input = initialsDialog.find('#initialsInput');
        input.val(current);

        // only English letters and digits are let in, two at most; a character which does not fit just does not appear, and the field says why
        input.on('input', function () {
            const cleaned = input.val().replace(/[^A-Za-z0-9]/g, '').slice(0, 2);
            initialsDialog.find('#initialsError').text(cleaned !== input.val() ? 'Only English letters and digits, two characters at most' : '');
            input.val(cleaned);
        });
        initialsDialog.on('click', e => {
            if (e.target === initialsDialog[0]) {
                closeInitialsDialog();
            }
        });
        initialsDialog.find('#initialsClose, #initialsCancel').on('click', closeInitialsDialog);
        $(document).on('keydown.initialsDialog', e => {
            if (e.key === 'Escape') {
                closeInitialsDialog();
            }
        });
        const save = function () {
            const value = input.val();
            if (!/^[A-Za-z0-9]{0,2}$/.test(value)) {
                initialsDialog.find('#initialsError').text('Only English letters and digits, two characters at most');
                return;
            }
            initialsDialog.find('#initialsSave, #initialsCancel').prop('disabled', true);
            airwaysAuth('POST', '/pilot/initials', {initials: value}, function (pilot) {
                closeInitialsDialog();
                renderPilot(pilot);
            }, function (e) {
                if (initialsDialog) {
                    initialsDialog.find('#initialsError').text(e && e.status === 400 ? 'Only English letters and digits, two characters at most' : 'The initials were not saved, try again');
                    initialsDialog.find('#initialsSave, #initialsCancel').prop('disabled', false);
                }
            });
        };
        initialsDialog.find('#initialsSave').on('click', save);
        input.on('keydown', e => {
            if (e.key === 'Enter') {
                save();
            }
        });
        input.trigger('focus').trigger('select');
    }

    // ---- the choice of the avatar: a click on the picture of the pilot opens a panel with all the pictures which may be chosen, the shown one is chosen
    // already. The list comes from the server (GET /pilot/avatars) only when the panel is opened; Save sends the chosen file name (POST /pilot/avatar).
    let avatarPicker = null;

    function closeAvatarPicker() {
        if (avatarPicker) {
            avatarPicker.remove();
            avatarPicker = null;
            $(document).off('keydown.avatarPicker');
        }
    }

    function openAvatarPicker() {
        if (avatarPicker || initialsDialog) {
            return;
        }
        avatarPicker = $(`
            <div class="picker-backdrop">
                <div class="picker-panel" role="dialog" aria-label="Choose your avatar">
                    <div class="picker-header"><span class="picker-title">Choose your avatar</span><button type="button" class="btn-close" id="pickerClose" aria-label="Close"></button></div>
                    <div class="picker-body" id="pickerBody"><div class="text-secondary">Loading...</div></div>
                    <div class="picker-footer">
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="pickerCancel">Cancel</button>
                        <button type="button" class="btn btn-sm btn-primary" id="pickerSave" disabled>Save</button>
                    </div>
                </div>
            </div>`);
        $('body').append(avatarPicker);

        // a click outside of the panel, the cross, Cancel and Escape close it without saving
        avatarPicker.on('click', e => {
            if (e.target === avatarPicker[0]) {
                closeAvatarPicker();
            }
        });
        avatarPicker.find('#pickerClose, #pickerCancel').on('click', closeAvatarPicker);
        $(document).on('keydown.avatarPicker', e => {
            if (e.key === 'Escape') {
                closeAvatarPicker();
            }
        });

        airwaysAuth('GET', '/pilot/avatars', {}, function (r) {
            if (!avatarPicker) {
                return; // closed while loading
            }
            let chosen = r.current;
            avatarPicker.find('#pickerBody').html('<div class="picker-grid">' + r.images.map(image =>
                '<button type="button" class="picker-tile' + (image === chosen ? ' selected' : '') + '" data-image="' + esc(image) + '" title="'
                + esc(image.replace(/\.png$/, '').replace(/_/g, ' ')) + '">' + avatarHtml(image) + '</button>').join('') + '</div>');
            avatarPicker.find('.picker-tile').on('click', function () {
                chosen = $(this).data('image');
                avatarPicker.find('.picker-tile').removeClass('selected');
                $(this).addClass('selected');
            });
            // the chosen picture is scrolled to the middle of the panel; the layout of the tiles may not be final at this moment, so it is done again on the next frames
            const body = avatarPicker.find('#pickerBody')[0];
            const centerChosen = () => {
                const selected = body.querySelector('.picker-tile.selected');
                if (selected) {
                    body.scrollTop += selected.getBoundingClientRect().top - body.getBoundingClientRect().top - (body.clientHeight - selected.offsetHeight) / 2;
                }
            };
            centerChosen();
            requestAnimationFrame(() => requestAnimationFrame(centerChosen));
            avatarPicker.find('#pickerSave').prop('disabled', false).on('click', function () {
                avatarPicker.find('#pickerSave, #pickerCancel').prop('disabled', true);
                airwaysAuth('POST', '/pilot/avatar', {image: chosen}, function (pilot) {
                    closeAvatarPicker();
                    renderPilot(pilot);
                }, function () {
                    alert('The avatar was not saved, try again');
                    if (avatarPicker) {
                        avatarPicker.find('#pickerSave, #pickerCancel').prop('disabled', false);
                    }
                });
            });
        }, function () {
            if (avatarPicker) {
                avatarPicker.find('#pickerBody').html('<div class="text-danger">The pictures could not be loaded</div>');
            }
        });
    }

    function renderPilot(p) {
        currentInitials = p.initials || '';
        $('#page').html(`
            ${pilotHeader({current: 'pilot', title: initialsTitleHtml(p.initials), avatarImage: p.avatarImage})}

            ${tiles([stateTile(p), locationTile(p), placeholderTile(), bankTile(p)])}
            ${tiles([awakeTile(p), dutyTile(p), flightTime30Tile(p), flightTime365Tile(p)])}
        `);
        $('.pilot-avatar').append('<button type="button" class="avatar-edit" title="Change the avatar" aria-label="Change the avatar">' + PENCIL_SVG + '</button>');
        $('.avatar-edit').on('click', openAvatarPicker);
        $('.initials-edit').on('click', openInitialsDialog);
        $('#sleepButton').on('click', () => sleepOrWake('/pilot/sleep'));
        $('#wakeButton').on('click', () => sleepOrWake('/pilot/wake'));
    }

    // a sleep or wake request is in flight: the refresh waits, so it does not draw an old state over the new one
    let actionInProgress = false;

    // POST /pilot/sleep or /pilot/wake: the answer is the pilot as GET /pilot gives it, the page is drawn again
    function sleepOrWake(url) {
        actionInProgress = true;
        $('#sleepButton, #wakeButton').prop('disabled', true);
        airwaysAuth('POST', url, {}, function (pilot) {
            actionInProgress = false;
            renderPilot(pilot);
        }, function (e) {
            actionInProgress = false;
            alert(e && e.status === 409 ? (e.responseJSON && e.responseJSON.message ? e.responseJSON.message : 'The pilot cannot do it now') : 'Failed, try again');
            loadPilot();
        });
    }

    // The page reads the pilot again once a minute (the awake time falls, the duty and the flight time change while a flight goes). A failed refresh
    // is not shown: the page keeps what it has until the next one.
    const REFRESH_INTERVAL_MS = 60 * 1000;

    function refreshPilot() {
        if (actionInProgress) {
            return;
        }
        airwaysAuth('GET', '/pilot', {}, function (pilot) {
            if (!actionInProgress) {
                renderPilot(pilot);
            }
        }, function () {
            // keep the current content
        });
    }

    function loadPilot() {
        airwaysAuth('GET', '/pilot', {}, renderPilot, function (e) {
            if (e && e.status === 401) {
                showPageError('Not signed in: check the token in localStorage (airwaysToken)');
            } else if (e && e.status === 404) {
                showPageError('You have no pilot yet');
            } else {
                showPageError('Failed to load the pilot');
            }
        });
    }

    $(document).ready(function () {
        showLoading();
        loadPilot();
        setInterval(refreshPilot, REFRESH_INTERVAL_MS);
    });
</script>

</body>
</html>
