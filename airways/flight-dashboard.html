<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>airways / Flight Dashboard</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/requests.js"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        .outer {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            width: 50rem;
            min-height: 34rem;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .dashboard-header {
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            padding: 0.75rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .dashboard-body {
            flex: 1;
            display: flex;
            flex-direction: row;
        }

        .sidebar {
            width: 15rem;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 1rem;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none;
        }

        .section-top {
            /*flex: 1;*/
            height: 3rem;
            display: flex;
            border-bottom: 1px solid #eee;
            flex-direction: row;
        }

        .section {
            /*flex: 3;*/
            display: flex;
            border-bottom: 1px solid #eee;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-label {
            width: 2.5rem;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            border-right: 1px solid #eee;
        }

        .section-content {
            flex: 1;
            padding: 1rem;
        }

        .airport-icao {
            font-size: 3rem;
            text-align: center;
        }

        .flight-time {
            font-size: 1.0rem;
            text-align: center;
        }

        .time-planned {
        }
        .time-actual {
            font-weight: 600;
        }
        .time-estimated {
            font-style: italic;
            color: gray;
        }

        .flight-type {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            padding-top: 10px;
        }

        .flight-passenger-count-layout {
            display: flex;
            flex-direction: row;
            padding-bottom: 10px;
        }

        .flight-passenger-count {
            flex: 1;
            text-align: center;
        }


        .stage-title {
            border-top: 1px solid #f4f4f4;
            text-align: center;
            font-size: 1.5rem;
            padding-top: 5px;
        }

        .stage-content {
            text-align: center;
        }

        .stage-buttons {
            text-align: center;
        }


        .flight-list-item {
            cursor: pointer;
        }

        .flight-list-item.flight-selected {
            border: 2px solid #0d6efd; /* bootstrap primary */
        }

        .flight-dof-today {
            background-color: #eaf7ee; /* light green */
        }

        .flight-dof-tomorrow {
            background-color: #eaf2ff; /* light blue */
        }

        .flight-dof-future {
            background-color: #f3f7ff; /* very light blue */
        }

        .flight-dof-past {
            background-color: #fff8db; /* light yellow */
        }
    </style>
</head>
<body>
<div class="outer">
    <div class="dashboard">
        <div class="dashboard-header">
            Flight Dashboard
        </div>

        <div class="dashboard-body">
            <div class="main">
                <div class="section-top">
                    <div style="flex: 1; border-right: 1px solid #eee; display: flex; flex-direction: row; font-size: 0.75em; text-align: center;">
                        <div style="flex: 2;">Sim<br><span id="sim-status-status">---</span></div>
                        <div style="flex: 3;"><span id="sim-status-location-status">---</span><br><span id="sim-status-airport-icao">---</span></div>
                        <div style="flex: 1;">P/B<br><span id="sim-status-parking-brake">---</span></div>
                        <div style="flex: 1;">ENG<br><span id="sim-status-engine-running">---</span></div>
                        <div style="flex: 1;">G/S<br><span id="sim-status-measured-gs">---</span></div>
                    </div>
                    <div style="flex: 0 0 9rem; font-size: 0.75em; text-align: center;">Tracking<br><span id="tracking-mode" class="fw-bold">---</span></div>
                </div>

                <div id="status-line" class="small text-muted text-center py-1"></div>
                <div id="user-state-warning" class="alert alert-danger m-2 py-2 hidden"></div>
                <div id="action-message" class="alert alert-secondary m-2 py-2 hidden"></div>

                <div class="section" style="flex-direction: column;">
                    <div id="flight-info" class="hidden">
                        <div style="display: flex; flex-direction: row;">
                            <div style="flex: 2;"></div>
                            <div id="flight-route-departure-icao" class="airport-icao" style="flex: 3;">AAAA</div>
                            <div class="airport-icao" style="flex: 1;">-</div>
                            <div id="flight-route-destination-icao" class="airport-icao" style="flex: 3;">ZZZZ</div>
                            <div style="flex: 2;"></div>
                        </div>
                        <div style="display: flex; flex-direction: row;">
                            <div style="flex: 1;"></div>
                            <div id="flight-time-of-departure" class="flight-time" style="flex: 1;">00:00</div>
                            <div id="flight-time-of-takeoff" class="flight-time" style="flex: 1;">00:10</div>
                            <div id="flight-time-of-landing" class="flight-time" style="flex: 1;">01:00</div>
                            <div id="flight-time-of-arrival" class="flight-time" style="flex: 1;">01:10</div>
                            <div style="flex: 1;"></div>
                        </div>
                        <div style="display: flex; flex-direction: column;">
                            <div id="flight-payload-ferry" class="flight-type">Ferry flight</div>
                            <div id="flight-payload-passenger">
                                <div class="flight-type">Passenger flight</div>
                                <div class="flight-passenger-count-layout">
                                    <div class="flight-passenger-count"></div>
                                    <div id="flight-payload-pax-sold" class="flight-passenger-count">Sold: <span id="flight-payload-pax-sold-count">-</span></div>
                                    <div id="flight-payload-pax-checked-in" class="flight-passenger-count">Checked-in: <span id="flight-payload-pax-checked-in-count">-</span></div>
                                    <div id="flight-payload-pax-on-board" class="flight-passenger-count">On board: <span id="flight-payload-pax-on-board-count">-</span></div>
                                    <div class="flight-passenger-count"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="flight-not-found" class="hidden">
                        <div class="stage-title">No active flight found</div>
                    </div>

                    <!-- one panel per flight status; its buttons are built from the actions of the status -->
                    <div id="flight-stage-dispatched" class="hidden">
                        <div class="stage-title">Before Start Flight</div>
                        <div class="stage-content stage-checks"></div>
                        <div class="stage-buttons stage-actions"></div>
                    </div>
                    <div id="flight-stage-preflight" class="hidden">
                        <div class="stage-title">Preflight</div>
                        <div class="stage-content stage-checks"></div>
                        <div class="stage-buttons stage-actions"></div>
                    </div>
                    <div id="flight-stage-departure" class="hidden">
                        <div class="stage-title">Departure</div>
                        <div class="stage-content stage-checks"></div>
                        <div class="stage-buttons stage-actions"></div>
                    </div>
                    <div id="flight-stage-flying" class="hidden">
                        <div class="stage-title">Flying</div>
                        <div class="stage-content stage-checks"></div>
                        <div class="stage-buttons stage-actions"></div>
                    </div>
                    <div id="flight-stage-arrival" class="hidden">
                        <div class="stage-title">Arrival</div>
                        <div class="stage-content stage-checks"></div>
                        <div class="stage-buttons stage-actions"></div>
                    </div>
                    <div id="flight-stage-postflight" class="hidden">
                        <div class="stage-title">Postflight</div>
                        <div class="stage-content stage-checks"></div>
                        <div class="stage-buttons stage-actions"></div>
                    </div>
                    <div id="flight-stage-finished" class="hidden">
                        <div class="stage-title">Finished</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // The dashboard works in two modes, the server tells which one in status2.mode:
    //   SIM_TRACKER - the sim tracker (G7 FlightBag etc.) does Blocks Off, Takeoff, Landing and Blocks On itself, here they are only shown as tracked automatically;
    //   MANUAL      - nothing tracks the flight, the pilot presses a button for every step.
    // What is offered now is in status2.actions (name + allowed + checks), the same list for both modes.

    // The steps which are done by the tracker in the SIM_TRACKER mode. In MANUAL mode they are buttons.
    const TRACKED_ACTIONS = ['blocks-off', 'takeoff', 'landing', 'blocks-on'];

    const ACTION_LABELS = {
        'start-flight': 'Start Flight',
        'start-boarding': 'Start Boarding',
        'blocks-off': 'Blocks Off',
        'takeoff': 'Takeoff',
        'landing': 'Landing',
        'blocks-on': 'Blocks On',
        'start-deboarding': 'Start Deboarding',
        'finish-flight': 'Finish Flight'
    };

    // The actions which are only the buttons of the status, the stage of a flight shows them
    const STAGE_BY_FLIGHT_STATUS = {
        'Dispatched': 'dispatched',
        'Preflight': 'preflight',
        'Departure': 'departure',
        'Flying': 'flying',
        'Arrival': 'arrival',
        'Postflight': 'postflight',
        'Finished': 'finished'
    };

    // The server refuses the actions in these states of the pilot of the user (403), the buttons are disabled
    const BLOCKING_USER_STATES = ['NO_PERSON', 'PERSON_NOT_IDLE', 'PERSON_NOT_AT_AIRPORT', 'WRONG_AIRPORT'];

    let flightId = null;
    let refreshTimerId = null;
    let actionInProgress = false;
    let lastStatus = null;
    let loadErrorShown = false;

    function escapeHtml(s) {
        return String(s ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function show(id) {
        $(id).removeClass('hidden');
    }

    function hide(id) {
        $(id).addClass('hidden');
    }

    // status2.pilot: { state, expectedAirport, currentAirport } - the verdict about the pilot
    function userStateMessage(pilot) {
        const state = pilot?.state;
        switch (state) {
            case 'NO_PERSON':
                return 'You have no pilot (person), flying is not available.';
            case 'PERSON_NOT_IDLE':
                return 'Your pilot is busy now (resting, travelling or on duty), flying is not available.';
            case 'PERSON_NOT_AT_AIRPORT':
                return 'Your pilot is not at an airport, flying is not available.';
            case 'WRONG_AIRPORT':
                return 'Your pilot is expected at ' + escapeHtml(pilot.expectedAirport ?? '?')
                    + ' but the simulator puts the aircraft at ' + escapeHtml(pilot.currentAirport ?? '?') + '.';
            default:
                return null;
        }
    }

    function isBlocked(status) {
        return BLOCKING_USER_STATES.includes(status?.pilot?.state);
    }

    // One line which mirrors what the other dashboard (G7) sees: pilot, flight and transport flight statuses, when the status was loaded
    function renderStatusLine(status) {
        const parts = [];
        const location = status.pilot;
        if (location) {
            parts.push("Pilot: " + location.state + (location.expectedAirport ? " at " + location.expectedAirport : ""));
        }
        if (status.flight) {
            parts.push("Flight: " + status.flight.fmSt + (status.flight.tfSt ? " / T/F: " + status.flight.tfSt : ""));
        }
        parts.push("updated " + new Date().toISOString().slice(11, 19) + "Z");
        $("#status-line").text(parts.join("  |  "));
    }

    function restartRefreshTimer() {
        if (refreshTimerId) {
            clearInterval(refreshTimerId);
        }
        refreshTimerId = setInterval(function () {
            if (!actionInProgress) {
                loadStatus2();
            }
        }, 10000);
    }

    function renderStatus2(status) {
        lastStatus = status;

        $('#sim-status-status').text(status.sim.status);
        $('#sim-status-location-status').text(status.sim.locationStatus ?? '---');
        $('#sim-status-airport-icao').text(status.sim.airportIcao ?? '---');
        $('#sim-status-parking-brake').text(status.sim.parkingBrake === null ? '' : status.sim.parkingBrake ? 'SET' : 'OFF');
        $('#sim-status-engine-running').text(status.sim.engineRunning === null ? '' : status.sim.engineRunning ? 'RUN' : 'OFF');
        $('#sim-status-measured-gs').text(status.sim.measuredGs ?? '');
        $('#tracking-mode').text(status.mode === 'SIM_TRACKER' ? 'Sim tracker' : 'Manual');

        renderStatusLine(status);

        const warning = userStateMessage(status.pilot);
        if (warning) {
            $('#user-state-warning').html(warning);
            show('#user-state-warning');
        } else {
            hide('#user-state-warning');
        }

        hide('#flight-info');
        hide('#flight-not-found');

        hide('#flight-payload-ferry');
        hide('#flight-payload-passenger');
        hide('#flight-payload-pax-sold');
        hide('#flight-payload-pax-checked-in');
        hide('#flight-payload-pax-on-board');

        Object.values(STAGE_BY_FLIGHT_STATUS).forEach(stage => hide('#flight-stage-' + stage));

        if (status.flight === null) {
            flightId = null;
            show('#flight-not-found');
            return;
        }

        show('#flight-info');

        flightId = status.flight.fmId;

        $('#flight-route-departure-icao').text(status.flight.dep);
        $('#flight-route-destination-icao').text(status.flight.dest);

        renderFlightTimeField('#flight-time-of-departure', status, 'dep');
        renderFlightTimeField('#flight-time-of-takeoff', status, 'tkf');
        renderFlightTimeField('#flight-time-of-landing', status, 'ldg');
        renderFlightTimeField('#flight-time-of-arrival', status, 'arr');

        if (status.flight.tfId !== null) {
            show('#flight-payload-passenger');
        } else {
            show('#flight-payload-ferry');
        }

        const tfSt = status.flight.tfSt;
        if (tfSt === 'Scheduled'
            || tfSt === 'CheckIn'
            || tfSt === 'WaitingForBoarding'
            || tfSt === 'Boarding') {
            show('#flight-payload-pax-sold');
            $('#flight-payload-pax-sold-count').text(status.flight.stkts);
        }
        if (tfSt === 'CheckIn' || tfSt === 'WaitingForBoarding' || tfSt === 'Boarding') {
            show('#flight-payload-pax-checked-in');
            $('#flight-payload-pax-checked-in-count').text(status.flight.ckdIn);
        }
        if (tfSt === 'Boarding'
            || tfSt === 'WaitingForDeparture'
            || tfSt === 'Departure'
            || tfSt === 'Flying'
            || tfSt === 'Arrival'
            || tfSt === 'WaitingForDeboarding'
            || tfSt === 'Deboarding') {
            show('#flight-payload-pax-on-board');
            $('#flight-payload-pax-on-board-count').text(status.flight.ponBrd);
        }

        const stage = STAGE_BY_FLIGHT_STATUS[status.flight.fmSt];
        if (stage) {
            show('#flight-stage-' + stage);
            if (stage !== 'finished') {
                renderStage(stage, status);
            }
        }
    }

    // The buttons of a stage are built from the actions of the status: a button for an action which the pilot does, a note for a step which
    // the tracker does. The disabled (red) button is an action which is offered but its checks do not pass yet.
    function renderStage(stage, status) {
        const $stage = $('#flight-stage-' + stage);
        const $buttons = $stage.find('.stage-actions').empty();
        const $checks = $stage.find('.stage-checks').empty();
        const blocked = isBlocked(status);
        const manual = status.mode === 'MANUAL';

        (status.actions ?? []).forEach(action => {
            if (action.name === 'reschedule') {
                return; // no dashboard button for it yet
            }

            if (TRACKED_ACTIONS.includes(action.name) && !manual) {
                $buttons.append('<button class="btn btn-outline-primary m-2 disabled">' + ACTION_LABELS[action.name] + ' will be tracked automatically</button>');
                return;
            }

            const label = ACTION_LABELS[action.name] ?? action.name;
            if (action.allowed && !blocked) {
                const $button = $('<button class="btn btn-success m-2"></button>').text(label);
                $button.on('click', function () {
                    sendAction(action.name);
                });
                $buttons.append($button);
            } else {
                $buttons.append($('<button class="btn btn-outline-danger m-2 disabled"></button>').text(label));
                (action.checks ?? []).filter(c => !c.result).forEach(c => {
                    $checks.append('<div class="text-danger small">' + escapeHtml(c.name) + '</div>');
                });
            }
        });

        // In the sim tracker mode the steps done by the tracker are not in the list of actions before their time, but the pilot has to know that
        // they are not done by a button: the stage says it.
        if (!manual && $buttons.children().length === 0) {
            const note = {
                'departure': 'Takeoff will be tracked automatically',
                'flying': 'Landing will be tracked automatically',
                'arrival': 'Blocks On will be tracked automatically'
            }[stage];
            if (note) {
                $buttons.append('<button class="btn btn-outline-primary m-2 disabled">' + note + '</button>');
            }
        }
    }

    function renderFlightTimeField(id, status, time) {
        $(id).removeClass('time-planned').removeClass('time-estimated').removeClass('time-actual');

        const planned = status.flight[`p${time}`];
        const estimated = status.flight[`e${time}`];
        const actual = status.flight[`a${time}`];

        if (actual) {
            $(id).text(actual).addClass('time-actual');
        } else if (estimated) {
            $(id).text(estimated).addClass('time-estimated');
        } else {
            $(id).text(planned).addClass('time-planned');
        }
    }

    function showActionMessage(text, isError) {
        if (!text) {
            hide('#action-message');
            return;
        }
        $('#action-message')
            .removeClass('alert-secondary alert-danger')
            .addClass(isError ? 'alert-danger' : 'alert-secondary')
            .text(text);
        show('#action-message');
    }

    function loadStatus2() {
        airwaysAuth('GET', '/flight-dashboard/status2', {}, function (response) {
            if (loadErrorShown) {
                loadErrorShown = false;
                showActionMessage(null);
            }
            renderStatus2(response);
        }, function (e) {
            loadErrorShown = true;
            showActionMessage('Failed to load the status (check token in localStorage: airwaysToken)', true);
        });
    }

    // POST /flight-dashboard/<action>, the response is the whole new status2
    function sendAction(actionName) {
        if (actionInProgress || flightId === null) {
            return;
        }
        actionInProgress = true;
        $('.stage-actions button').addClass('disabled');
        showActionMessage((ACTION_LABELS[actionName] ?? actionName) + '...', false);

        airwaysAuth('POST', `/flight-dashboard/${actionName}`, {
            flightId: flightId,
        }, function (response) {
            actionInProgress = false;
            showActionMessage(null);
            renderStatus2(response);
            restartRefreshTimer();
        }, function (e) {
            actionInProgress = false;
            const code = e && e.status ? 'HTTP ' + e.status : 'no connection';
            const reason = e && e.responseJSON && e.responseJSON.message ? ': ' + e.responseJSON.message : '';
            showActionMessage('The action was refused (' + code + reason + ')', true);
            loadStatus2(); // the world may have moved on, show how it is now
        });
    }

    $(document).ready(function () {
        loadStatus2();
        restartRefreshTimer();
    });

</script>

</body>
</html>
